const taiwanDateParts = (date = new Date()) => {

const nf = (n) => (n ?? 0).toLocaleString("zh-TW", { maximumFractionDigits: 0 });

// A categorical XAxis (dataKey pointing at a string) spaces every point
// evenly by ARRAY INDEX, never by real elapsed time. That's invisible when
// records are evenly spaced, but this app's history mixes a handful of
// sparse quarterly snapshots (2021-2024) with dense near-daily records
// (2025-2026): ~14 old points vs ~80 recent ones. Index-spacing squeezes
// those 3+ sparse years into a sliver near the left edge and stretches the
// last ~14 months across almost the entire chart — years of real history
// look "short", and the line connecting the sparse old points draws a fake
// smooth ramp that isn't really there. Picking better tick *labels* (the
// previous fix here) can't correct this: labels just get relabeled at
// whatever index position their date happens to fall on.
// The real fix is a numeric time-scaled axis: chartData now carries a "t"
// timestamp, the XAxis uses type="number" with a dataMin/dataMax domain, so
// pixel position is proportional to actual elapsed time. pickEvenTimeTicks
// just returns evenly spaced timestamps to label — no snapping to existing
// data needed, since a continuous numeric axis can place a tick anywhere.
function pickEvenTimeTicks(data, key, count = 6) {
  if (!data || data.length === 0) return [];
  const minT = data[0][key], maxT = data[data.length - 1][key];
  if (minT === maxT) return [minT];
  const ticks = [];
  for (let i = 0; i < count; i++) {
    ticks.push(Math.round(minT + ((maxT - minT) * i) / (count - 1)));
  }
  return ticks;
}
function formatTickDate(t) {
  const d = new Date(t);
  const y = String(d.getFullYear()).slice(2);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

const pf = (n) => `${n >= 0 ? "+" : ""}${(n ?? 0).toFixed(2)}%`;

// Lazily injects the SheetJS (xlsx) library the first time Excel export is
// actually used, instead of loading it eagerly on every page load. This
// keeps a large third-party script fully off the critical boot path — if
// it fails to load for any reason, only the Excel button is affected, not
// the rest of the app. Cached at module scope (not component state) so a
// second click reuses the same in-flight/completed load instead of
// injecting the script tag again.
let xlsxLoadPromise = null;
function loadXLSXLibrary() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    script.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error("XLSX 載入後仍無法使用")));
    script.onerror = () => reject(new Error("XLSX 函式庫載入失敗，請確認網路連線"));
    document.head.appendChild(script);
  }).catch((err) => { xlsxLoadPromise = null; throw err; }); // allow retry on next click if it failed
  return xlsxLoadPromise;
}

// Animates a number counting up/down to its new value instead of jumping
// instantly — used for the big "目前總資產" figure so a live-price refresh
// feels like something happened rather than a silent swap.
function AnimatedNumber({ value, prefix = "" }) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(value);
  const rafRef = useRef(null);
  useEffect(() => {
    const from = fromRef.current;
    const to = value;
    if (from === to) return;
    const duration = 500;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      setDisplay(Math.round(from + (to - from) * eased));
      if (t < 1) rafRef.current = requestAnimationFrame(tick);
      else fromRef.current = to;
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [value]);
  return <span>{prefix}{nf(display)}</span>;
}

// ---------- date helpers ----------
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d || 1);
}
function monthsBetween(dateA, dateB) {
  const a = parseLocalDate(dateA), b = parseLocalDate(dateB);
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth())
    + (b.getDate() - a.getDate()) / 30;
}
function addMonths(dateStr, n) {
  const d = parseLocalDate(dateStr);
  d.setMonth(d.getMonth() + Math.round(n));
  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}
// build a monthly projection schedule: month 0 = start date
function buildSchedule({ startDate, initialCapital, initialPrincipal, initialAssets, monthlyAmount, annualReturn, horizonMonths }) {
  const principal0 = Number(initialPrincipal ?? initialCapital ?? 0);
  const assets0 = Number(initialAssets ?? initialCapital ?? principal0);
  const rm = Math.pow(1 + (annualReturn / 100), 1 / 12) - 1;
  const rows = [{ index: 0, principal: principal0, assets: assets0 }];
  for (let i = 1; i <= horizonMonths; i++) {
    const prev = rows[i - 1];
    rows.push({
      index: i,
      principal: prev.principal + monthlyAmount,
      assets: prev.assets * (1 + rm) + monthlyAmount,
    });
  }
  return rows;
}
// find the first schedule index whose `key` value reaches `target`, with linear interpolation
// Whether it's currently within TWSE trading hours (weekdays 09:00–13:30,
// using the device's local time — fine since this app is used in Taiwan).
// Only checks weekday + time window; it doesn't know about public holidays,
// so a market holiday will still count as "open" here and the auto-refresh
// will fire a few extra times that day — harmless, just not perfectly precise.
function isTwseTradingHours(date = new Date()) {
  const tw = new Date(date.toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
  const day = tw.getDay(); // 0 = Sunday, 6 = Saturday
  if (day === 0 || day === 6) return false;
  const minutes = tw.getHours() * 60 + tw.getMinutes();
  return minutes >= 9 * 60 && minutes <= 13 * 60 + 30;
}

function findCrossing(schedule, key, target) {
  if (!schedule.length) return null;
  if (target <= schedule[0][key]) return { index: 0 };
  for (let i = 1; i < schedule.length; i++) {
    if (schedule[i][key] >= target) {
      const prev = schedule[i - 1][key], cur = schedule[i][key];
      const frac = cur === prev ? 0 : (target - prev) / (cur - prev);
      return { index: i - 1 + frac };
    }
  }
  return { index: schedule.length - 1, beyond: true };
}

// ---------- live price helpers (Cloudflare Pages Function) ----------
// The front end sends the symbols that are actually held to the same-origin
// /quote endpoint. Cloudflare then talks to TWSE/Yahoo server-side, so the
// browser no longer needs any public CORS proxy.
async function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

// ---------- independent AI fallback helpers ----------
// The fallback URL points to a second provider (for example Vercel), so it
// can still answer even when Cloudflare Workers AI quota is exhausted.
function normalizeExternalAiAskUrl(raw) {
  const text = String(raw || "").trim();
  if (!text) return "";
  try {
    const u = new URL(text);
    if (u.protocol !== "https:" && !(u.protocol === "http:" && /^(localhost|127\.0\.0\.1)$/.test(u.hostname))) return "";
    const cleanPath = u.pathname.replace(/\/+$/, "");
    if (!cleanPath || cleanPath === "/") u.pathname = "/api/ask";
    else if (!cleanPath.endsWith("/api/ask")) u.pathname = `${cleanPath}/api/ask`;
    else u.pathname = cleanPath;
    u.search = "";
    u.hash = "";
    return u.toString();
  } catch {
    return "";
  }
}

function externalAiHealthUrl(raw) {
  const askUrl = normalizeExternalAiAskUrl(raw);
  if (!askUrl) return "";
  const u = new URL(askUrl);
  u.pathname = u.pathname.replace(/\/api\/ask$/, "/api/health");
  return u.toString();
}

function shouldUseExternalAiFallback(error) {
  const status = Number(error?.status || 0);
  const msg = String(error?.message || "");
  if (!status) return true; // network/timeout
  if (status === 401 || status === 403 || status === 408 || status === 429) return true;
  if (status >= 500) return true;
  return /neuron|quota|額度|limit|binding|AI 服務|timeout|逾時|temporar/i.test(msg);
}

async function fetchQuotesWithFallback(symbols) {
  if (!Array.isArray(symbols) || !symbols.length) return { quotes: {}, missing: [], complete: true };
  const unique = [...new Set(symbols.map((s) => String(s).trim().toUpperCase()).filter(Boolean))];
  const url = `/quote?symbols=${encodeURIComponent(unique.join(","))}&_ts=${Date.now()}`;
  const res = await fetchWithTimeout(url, { cache: "no-store" }, 9000);
  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`報價 API 回傳格式錯誤（HTTP ${res.status}）`);
  }
  if (!res.ok || !data?.ok || !data?.quotes) {
    throw new Error(data?.error || `報價 API 失敗（HTTP ${res.status}）`);
  }
  const missing = Array.isArray(data.missing) ? data.missing : unique.filter((sym) => !data.quotes[sym]);
  return {
    quotes: data.quotes,
    missing,
    complete: data.status === "complete" || missing.length === 0,
    status: data.status || (missing.length ? "partial" : "complete"),
  };
}

// ---------- news helpers (持股新聞摘要，Cloudflare Function: /news) ----------
async function fetchStockNews(activeHoldings) {
  if (!activeHoldings.length) return {};
  const symbols = activeHoldings.map((h) => h.symbol).join(",");
  const names = activeHoldings.map((h) => h.name || "").join(",");
  const url = `/news?symbols=${encodeURIComponent(symbols)}&names=${encodeURIComponent(names)}&_ts=${Date.now()}`;
  const res = await fetchWithTimeout(url, { cache: "no-store" }, 10000);
  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`新聞 API 回傳格式錯誤（HTTP ${res.status}）`);
  }
  if (!res.ok || !data?.ok) {
    throw new Error(data?.error || `新聞 API 失敗（HTTP ${res.status}）`);
  }
  return data.news || {};
}

function relativeTimeLabel(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 60) return `${Math.max(1, mins)} 分鐘前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} 小時前`;
  const days = Math.floor(hrs / 24);
  return `${days} 天前`;
}

// ---------- AI 問答用：把目前持股狀況整理成一段純文字，讓 Claude 直接讀 ----------
function buildPortfolioContext(holdings, goal, totalToday, totalInvested, trades, dailyRecords, dividends, planItems, planSchedule, goalDate, perf) {
  const lines = [];
  const overallPct = goal?.targetAmount ? Math.min(100, (totalToday / goal.targetAmount) * 100) : 0;
  const remain = goal?.targetAmount ? Math.max(0, goal.targetAmount - totalToday) : 0;
  lines.push(`總目標：${goal?.targetYear || "-"} 年 NT$${nf(goal?.targetAmount || 0)}`);
  lines.push(`目前總資產：NT$${nf(totalToday || 0)}（已達成整體目標${overallPct.toFixed(1)}%，距目標還差NT$${nf(remain)}）`);
  lines.push(`整體目標預計達成時間：${goalDate ? goalDate : "以目前的計畫假設無法在投影期間內達成，或尚未設定"}`);
  if (totalInvested != null) lines.push(`累計投入本金：NT$${nf(totalInvested)}`);

  // 總覽頁的績效數字（持倉損益、累積股息、粗估總報酬/報酬率、資產新高/拉回、今年以來報酬）。
  if (perf) {
    lines.push(`持倉損益(估)：NT$${nf(perf.capitalGain)}`);
    lines.push(`累積股息：NT$${nf(perf.totalDividends)}`);
    lines.push(`粗估總報酬：NT$${nf(perf.totalReturn)}，粗估報酬率：${perf.totalReturnPct.toFixed(2)}%`);
    if (perf.highPoint?.date) lines.push(`資產歷史新高：NT$${nf(perf.highPoint.value)}（${perf.highPoint.date}），目前從新高拉回：${perf.drawdown.toFixed(2)}%`);
    lines.push(`今年資產變化(YTD)：NT$${nf(perf.ytdGain)}，YTD報酬率：${perf.ytdPct.toFixed(2)}%`);
    if (perf.startingCost) lines.push(`起始成本(計畫外的期初投入)：NT$${nf(perf.startingCost)}`);
  }

  // 計畫進度頁：資產累積 vs 本金累積的投影比較（資產是否超前/落後於本金投入的速度）。
  if (perf && perf.elapsedMonths != null) {
    lines.push(`計畫進度：已執行${perf.elapsedMonths}個月` +
      (perf.leadMonths != null ? `，資產成長進度${perf.leadMonths >= 0 ? "領先" : "落後"}本金投入進度約${Math.abs(perf.leadMonths)}個月` : ""));
  }

  const active = holdings.filter((h) => h.symbol);
  for (const h of active) {
    const parts = [
      `${h.symbol}(${h.name || ""})`,
      `目前${nf(h.current || 0)}股`,
      h.target2035 ? `目標${nf(h.target2035)}股(達成率${(h.pct || 0).toFixed(1)}%)` : null,
      h.avgCost != null ? `平均成本NT$${h.avgCost.toFixed(2)}` : null,
      h.avgTradePrice != null ? `成交均價(不含手續費)NT$${h.avgTradePrice.toFixed(2)}` : null,
      h.estCostBasis != null ? `持有成本NT$${nf(h.estCostBasis)}` : null,
      h.quarterSharesAdded != null ? `第${h.quarterNum}季增加${h.quarterSharesAdded}股` : null,
      h.yearSharesAdded != null ? `今年累計增加${h.yearSharesAdded}股` : null,
      h.projectedLabel ? h.projectedLabel : null,
    ].filter(Boolean);
    lines.push(parts.join("，"));
  }

  // 交易明細：均價就是從這些原始買賣紀錄算出來的，沒有這段 AI 只看得到結果、看不到算式，
  // 遇到「為什麼均價跟券商對不起來」這種問題會答不出所以然。
  // 每檔股票的紀錄可能有上百筆，塞太多會超過訊息大小，所以只帶最近 20 筆，並註明實際總筆數。
  const allTrades = Array.isArray(trades) ? trades : [];
  for (const h of active) {
    const symbolTrades = allTrades
      .filter((t) => t.symbol === h.symbol)
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date));
    if (symbolTrades.length === 0) continue;

    const recent = symbolTrades.slice(-20);
    const omitted = symbolTrades.length - recent.length;
    lines.push(`\n${h.symbol} 交易紀錄${omitted > 0 ? `（共${symbolTrades.length}筆，以下為最近20筆）` : `（共${symbolTrades.length}筆）`}：`);
    for (const t of recent) {
      const fee = t.fee ? `，手續費${t.fee}` : "";
      lines.push(`${t.date} ${t.action === "buy" ? "買進" : "賣出"} ${t.shares}股 @NT$${t.price}${fee}`);
    }
  }

  // 每日紀錄（資產曲線）：只帶最近 20 筆，長期歷史留給圖表看就好，這裡是給「最近走勢」用的。
  const sortedDaily = Array.isArray(dailyRecords)
    ? [...dailyRecords].sort((a, b) => a.date.localeCompare(b.date))
    : [];
  if (sortedDaily.length > 0) {
    const recentDaily = sortedDaily.slice(-20);
    const omitted = sortedDaily.length - recentDaily.length;
    lines.push(`\n每日紀錄${omitted > 0 ? `（共${sortedDaily.length}筆，以下為最近20筆）` : `（共${sortedDaily.length}筆）`}：`);
    for (const r of recentDaily) {
      const total = (r.twValue || 0) + (r.usValue || 0);
      lines.push(`${r.date} 資產NT$${nf(total)}（台股${nf(r.twValue || 0)}+美股${nf(r.usValue || 0)}）`);
    }
  }

  // 配息紀錄：只帶最近 20 筆。
  const sortedDividends = Array.isArray(dividends)
    ? [...dividends].sort((a, b) => a.date.localeCompare(b.date))
    : [];
  if (sortedDividends.length > 0) {
    const recentDiv = sortedDividends.slice(-20);
    const omitted = sortedDividends.length - recentDiv.length;
    lines.push(`\n配息紀錄${omitted > 0 ? `（共${sortedDividends.length}筆，以下為最近20筆）` : `（共${sortedDividends.length}筆）`}：`);
    for (const d of recentDiv) {
      lines.push(`${d.date} ${d.symbol} ${nf(d.shares)}股 @NT$${d.perShare}/股 = NT$${nf(d.amount)}`);
    }
  }

  // 計畫設定：定期定額配置 + 資產成長曲線假設（計畫進度頁面用來投影「預計達成日」的依據）。
  if (Array.isArray(planItems) && planItems.length > 0) {
    lines.push(`\n定期定額配置：`);
    for (const p of planItems) {
      lines.push(`${p.symbol} 每期NT$${nf(p.amount)}${p.note ? `（${p.note}）` : ""}`);
    }
  }
  if (planSchedule) {
    lines.push(`\n資產成長計畫假設：起始日${planSchedule.startDate}，起始本金NT$${nf(planSchedule.initialPrincipal ?? planSchedule.initialCapital)}，` +
      `起始資產NT$${nf(planSchedule.initialAssets ?? planSchedule.initialCapital)}，每月投入NT$${nf(planSchedule.monthlyAmount)}，年化報酬率${planSchedule.annualReturn}%，` +
      `投影期間${planSchedule.horizonMonths}個月`);
  }

  return lines.join("\n");
}


// ---------- storage helpers ----------
async function loadKey(key, fallback) {
  try {
    if (window.storage?.get) {
      const res = await window.storage.get(key, false);
      if (res?.value) return JSON.parse(res.value);
    }
    const local = window.localStorage?.getItem(key);
    return local ? JSON.parse(local) : fallback;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  const payload = JSON.stringify(value);
  let saved = false;
  try {
    if (window.storage?.set) {
      await window.storage.set(key, payload, false);
      saved = true;
    }
  } catch (e) {
    console.warn("window.storage save failed", key, e);
  }
  try {
    window.localStorage?.setItem(key, payload);
    saved = true;
  } catch (e) {
    console.warn("localStorage save failed", key, e);
  }
  if (!saved) console.error("storage save failed", key);
}

function isObject(v) {
  return v != null && typeof v === "object" && !Array.isArray(v);
}

function isValidDateStr(v) {
  if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const d = parseLocalDate(v);
  return Number.isFinite(d.getTime()) && `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` === v;
}

function finiteNonNegative(v) {
  return v == null || v === "" || (Number.isFinite(Number(v)) && Number(v) >= 0);
}

function inspectBackupPayload(payload) {
  const errors = [], warnings = [];
  if (!isObject(payload)) return { ok: false, errors: ["最外層不是有效物件"], warnings };
  const data = isObject(payload.data) ? payload.data : payload; // schema 1 相容
  const schemaVersion = Number(payload.schemaVersion || 1);
  if (!Number.isFinite(schemaVersion) || schemaVersion < 1) errors.push("schemaVersion 不合法");
  if (schemaVersion > BACKUP_SCHEMA_VERSION) errors.push(`備份 schema ${schemaVersion} 比目前 App 支援的 ${BACKUP_SCHEMA_VERSION} 新，為避免資料損壞不匯入`);

  const requiredArrays = ["dailyRecords", "holdings", "trades", "dividends", "planItems"];
  requiredArrays.forEach((k) => { if (!Array.isArray(data[k])) errors.push(`${k} 不是陣列`); });
  if (!isObject(data.goal)) errors.push("goal 不存在或格式錯誤");
  if (!isObject(data.planSchedule)) errors.push("planSchedule 不存在或格式錯誤");
  if (errors.length) return { ok: false, errors, warnings, data, schemaVersion };

  data.dailyRecords.forEach((r, i) => {
    if (!isObject(r) || !isValidDateStr(r.date)) errors.push(`每日紀錄第 ${i + 1} 筆日期不合法`);
    ["twValue", "usValue", "twCost", "usCost"].forEach((k) => {
      if (!finiteNonNegative(r?.[k])) errors.push(`每日紀錄第 ${i + 1} 筆 ${k} 不是有效非負數字`);
    });
  });
  data.holdings.forEach((h, i) => {
    if (!isObject(h) || !String(h.symbol || "").trim()) errors.push(`持股第 ${i + 1} 筆缺少股票代號`);
    ["initialShares", "current", "target2035", "avgCost", "manualAvgCost"].forEach((k) => {
      if (!finiteNonNegative(h?.[k])) errors.push(`持股第 ${i + 1} 筆 ${k} 不是有效非負數字`);
    });
  });
  data.trades.forEach((t, i) => {
    if (!isObject(t) || !isValidDateStr(t.date)) errors.push(`交易第 ${i + 1} 筆日期不合法`);
    if (!String(t?.symbol || "").trim()) errors.push(`交易第 ${i + 1} 筆缺少股票代號`);
    if (!(["buy", "sell"].includes(t?.action))) errors.push(`交易第 ${i + 1} 筆買賣方向不合法`);
    if (!(Number(t?.shares) > 0)) errors.push(`交易第 ${i + 1} 筆股數必須大於 0`);
    if (!(Number(t?.price) > 0)) errors.push(`交易第 ${i + 1} 筆成交價必須大於 0`);
    ["fee", "tax", "amount"].forEach((k) => { if (!finiteNonNegative(t?.[k])) errors.push(`交易第 ${i + 1} 筆 ${k} 不合法`); });
    if (Number.isFinite(Number(t?.amount)) && Number(t?.shares) > 0 && Number(t?.price) > 0) {
      const fee = Number(t?.fee || 0), tax = Number(t?.tax || 0);
      const expected = t.action === "sell"
        ? Number(t.shares) * Number(t.price) - fee - tax
        : Number(t.shares) * Number(t.price) + fee;
      if (Math.abs(Number(t.amount) - expected) > 1) warnings.push(`交易第 ${i + 1} 筆交易金額與股數×價格不一致`);
    }
  });
  data.dividends.forEach((d, i) => {
    if (!isObject(d) || !isValidDateStr(d.date)) errors.push(`配息第 ${i + 1} 筆日期不合法`);
    if (!String(d?.symbol || "").trim()) errors.push(`配息第 ${i + 1} 筆缺少股票代號`);
    ["shares", "perShare", "amount"].forEach((k) => { if (!finiteNonNegative(d?.[k])) errors.push(`配息第 ${i + 1} 筆 ${k} 不合法`); });
  });
  data.planItems.forEach((x, i) => {
    if (!isObject(x) || !String(x.symbol || "").trim()) errors.push(`定期定額第 ${i + 1} 筆缺少標的`);
    if (!finiteNonNegative(x?.amount)) errors.push(`定期定額第 ${i + 1} 筆金額不合法`);
  });

  if (!(Number(data.goal?.targetAmount) > 0)) errors.push("目標金額必須大於 0");
  if (!(Number(data.goal?.targetYear) >= 2000 && Number(data.goal?.targetYear) <= 2200)) errors.push("目標年份不合理");
  if (!isValidDateStr(data.planSchedule?.startDate)) errors.push("計畫起始日不合法");
  ["initialCapital", "initialPrincipal", "initialAssets", "monthlyAmount"].forEach((k) => {
    if (data.planSchedule?.[k] != null && !finiteNonNegative(data.planSchedule[k])) errors.push(`planSchedule.${k} 不合法`);
  });
  if (data.planSchedule?.annualReturn != null && !(Number(data.planSchedule.annualReturn) > -100 && Number.isFinite(Number(data.planSchedule.annualReturn)))) errors.push("年化報酬率不合法");
  if (data.planSchedule?.horizonMonths != null && !(Number(data.planSchedule.horizonMonths) > 0)) errors.push("投影月數必須大於 0");
  if (schemaVersion >= 2 && data.costBasis != null && (!isObject(data.costBasis) || !finiteNonNegative(data.costBasis.startingCost))) errors.push("costBasis 格式不合法");

  const duplicateIds = (arr, label) => {
    const seen = new Set(), dup = new Set();
    arr.forEach((x) => { const id = String(x?.id || "").trim(); if (id && seen.has(id)) dup.add(id); else if (id) seen.add(id); });
    if (dup.size) warnings.push(`${label} 有 ${dup.size} 個重複 ID`);
  };
  duplicateIds(data.holdings, "持股");
  duplicateIds(data.trades, "交易");
  duplicateIds(data.dividends, "配息");
  duplicateIds(data.planItems, "定期定額");
  const holdingSymbols = data.holdings.map((h) => String(h?.symbol || "").trim()).filter(Boolean);
  if (new Set(holdingSymbols).size !== holdingSymbols.length) warnings.push("持股清單有重複股票代號");
  const dates = data.dailyRecords.map((r) => r?.date).filter(Boolean);
  if (new Set(dates).size !== dates.length) warnings.push("每日紀錄有重複日期，匯入後請檢查是否為刻意保留");

  return { ok: errors.length === 0, errors, warnings, data, schemaVersion };
}

// ---- seed data imported from user's Excel (存股現況表) ----
const DAILY_SEED = [];

function AssetTracker() {
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("dashboard");
  // Set (with a fresh object each time so the effect in DailyPanel re-fires
  // even if the same number is sent twice) when "記錄為今日資產" is pressed
  // on the dashboard — carries the fetched TW market value over to the
  // 每日紀錄 form so the user can add the US-side value and confirm together.
  const [dailyPrefill, setDailyPrefill] = useState(null);
  // Lifted out of DailyPanel itself: that panel only renders while
  // tab === "daily", so a useState inside it gets wiped every time you
  // switch away and back (e.g. going to 總覽 to fill market value, then to
  // 交易紀錄 to fill cost — each visit was resetting whatever the other one
  // had just filled in). Owning it here means it survives tab switches.
  const [dailyForm, setDailyForm] = useState({ date: todayStr(), twValue: "", usValue: "", twCost: "", usCost: "" });

  // 左右滑動切換分頁：只在明確的水平手勢時觸發，避免正常上下捲動誤換頁。
  // 從輸入框、按鈕、連結、圖表等互動區開始的手勢一律不接管。
  const swipeStartRef = useRef(null);
  const swipeBlockedRef = useRef(false);

  // 換頁動畫：仿 iPhone 主畫面切頁——舊、新兩頁接在一起變成一條「長條」，
  // 整條一起橫向平移一個畫面寬度，不是各自淡入淡出。這樣兩頁之間不會疊
  // 在一起看到底層的殘影，因為同一時間畫面上永遠只看得到「半條」內容。
  // transitionState 非 null 的這段期間，畫面上同時掛著新舊兩頁；
  // settled 控制的是「有沒有套用 transition + 移到定位」，靠兩次
  // requestAnimationFrame 確保瀏覽器先畫出起始位置、才套用動畫，
  // 不然兩個狀態擠在同一幀會被瀏覽器直接跳過，看起來就是瞬間切換。
  const [transitionState, setTransitionState] = useState(null); // { from, to, dir } | null
  const [settled, setSettled] = useState(true);
  const tabTransitionRaf1Ref = useRef(null);
  const tabTransitionRaf2Ref = useRef(null);

  // 統一的換頁入口：不管是滑手勢還是點下面的分頁按鈕，都走這裡，
  // 這樣兩種切換方式的動畫才會一致。
  const goToTab = (nextId) => {
    if (nextId === tab || transitionState) return;
    const fromIndex = TABS.findIndex((x) => x.id === tab);
    const toIndex = TABS.findIndex((x) => x.id === nextId);
    if (toIndex < 0) return;
    const dir = toIndex > fromIndex ? "left" : "right";
    setTransitionState({ from: tab, to: nextId, dir });
    setSettled(false);
    setTab(nextId);
  };

  useEffect(() => {
    if (!transitionState || settled) return;
    // 第一幀先讓瀏覽器畫出起點，第二幀才移到終點，CSS transition 才會真的跑。
    tabTransitionRaf1Ref.current = requestAnimationFrame(() => {
      tabTransitionRaf2Ref.current = requestAnimationFrame(() => setSettled(true));
    });
    return () => {
      if (tabTransitionRaf1Ref.current != null) cancelAnimationFrame(tabTransitionRaf1Ref.current);
      if (tabTransitionRaf2Ref.current != null) cancelAnimationFrame(tabTransitionRaf2Ref.current);
      tabTransitionRaf1Ref.current = null;
      tabTransitionRaf2Ref.current = null;
    };
  }, [transitionState, settled]);

  const onPageTouchStart = (e) => {
    if (!e.touches || e.touches.length !== 1) {
      swipeStartRef.current = null;
      swipeBlockedRef.current = true;
      return;
    }
    const target = e.target;
    swipeBlockedRef.current = Boolean(
      target?.closest?.('input, textarea, select, button, a, [role="button"], .recharts-wrapper, [data-no-page-swipe="true"]')
    );
    const t = e.touches[0];
    swipeStartRef.current = { x: t.clientX, y: t.clientY };
  };

  const onPageTouchEnd = (e) => {
    const start = swipeStartRef.current;
    swipeStartRef.current = null;
    if (!start || swipeBlockedRef.current || !e.changedTouches || e.changedTouches.length !== 1) return;

    const t = e.changedTouches[0];
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    // 至少滑 70px，而且水平位移要明顯大於垂直位移，才算換頁手勢。
    if (absX < 70 || absX < absY * 1.35) return;

    const currentIndex = TABS.findIndex((x) => x.id === tab);
    if (currentIndex < 0) return;

    // 左滑 = 下一頁；右滑 = 上一頁。第一頁/最後一頁不循環。
    const nextIndex = dx < 0 ? currentIndex + 1 : currentIndex - 1;
    if (nextIndex < 0 || nextIndex >= TABS.length) return;

    goToTab(TABS[nextIndex].id);
  };

  const [dailyRecords, setDailyRecords] = useState([]);
  const [holdings, setHoldings] = useState([]);
  const [trades, setTrades] = useState([]);
  const [dividends, setDividends] = useState([]);
  const [planItems, setPlanItems] = useState([]);
  const [goal, setGoal] = useState({ targetAmount: 10000000, targetYear: 2035 });
  const [planSchedule, setPlanSchedule] = useState(defaultPlanSchedule());
  // Starting cost basis, before any trade in the 交易紀錄 log — combined
  // with the running buy/sell total to get today's accumulated cost.
  const [costBasis, setCostBasis] = useState({ startingCost: 0 });
  const [lastBackupAt, setLastBackupAt] = useState(null);
  // Gemini 備援權限只控制是否把私人持股 context 交給 Gemini；API Key 永遠只留在 Cloudflare Worker Secret。
  const [aiFallbackConfig, setAiFallbackConfig] = useState({ url: "", token: "", allowPrivate: false });
  // 系統健康卡片：由 Cloudflare 背景排程（或手動觸發）產生，App 開啟時抓一次現況。
  // 只是顯示用的暫存狀態，不寫進 localStorage/JSON 備份——它本來就是伺服器端的資料。
  const [healthCards, setHealthCards] = useState([]);
  const [healthCardBusyId, setHealthCardBusyId] = useState("");

  // ---- initial load ----
  useEffect(() => {
    (async () => {
      const [dr, h, t, dv, p, g, ps, cb, lba, afc] = await Promise.all([
        loadKey("dailyRecords", defaultDailyRecords()),
        loadKey("holdings", defaultHoldings()),
        loadKey("trades", defaultTrades()),
        loadKey("dividends", defaultDividends()),
        loadKey("planItems", defaultPlan()),
        loadKey("goal", { targetAmount: 10000000, targetYear: 2035 }),
        loadKey("planSchedule", defaultPlanSchedule()),
        loadKey("costBasis", { startingCost: 0 }),
        loadKey("lastBackupAt", null),
        loadKey("aiFallbackConfig", { url: "", token: "", allowPrivate: false }),
      ]);
      setDailyRecords(dr);
      setHoldings(h);
      setTrades(t);
      setDividends(dv);
      setPlanItems(p);
      setGoal(g);
      const defaultPs = defaultPlanSchedule();
      setPlanSchedule({
        ...defaultPs,
        ...ps,
        initialPrincipal: Number(ps?.initialPrincipal ?? ps?.initialCapital ?? defaultPs.initialPrincipal),
        initialAssets: Number(ps?.initialAssets ?? ps?.initialCapital ?? defaultPs.initialAssets),
      });
      setCostBasis(isObject(cb) ? { ...{ startingCost: 0 }, ...cb } : { startingCost: 0 });
      setLastBackupAt(typeof lba === "string" && Number.isFinite(Date.parse(lba)) ? lba : null);
      setAiFallbackConfig(isObject(afc) ? {
        url: String(afc.url || ""),
        token: String(afc.token || ""),
        allowPrivate: afc.allowPrivate === true,
      } : { url: "", token: "", allowPrivate: false });
      setReady(true);
    })();
  }, []);

  // ---- 系統健康卡片：App 開啟時抓一次現況，不需要密集輪詢 ----
  const fetchHealthCards = async () => {
    try {
      const res = await fetch("/api/health-cards", { cache: "no-store" });
      const data = await res.json().catch(() => null);
      const cards = Array.isArray(data?.cards) ? data.cards : [];
      setHealthCards(cards.filter((c) => c?.status === "pending"));
    } catch {
      // 抓不到就算了，不要讓這個非必要功能影響主畫面；使用者下次開 App 再試一次即可。
    }
  };
  useEffect(() => { fetchHealthCards(); }, []);

  const respondHealthCard = async (id, action) => {
    setHealthCardBusyId(id);
    try {
      await fetch("/api/health-cards", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ id, action }),
      });
      setHealthCards((cards) => cards.filter((c) => c.id !== id));
    } catch {
      // 送失敗就留著卡片，讓使用者可以再按一次。
    } finally {
      setHealthCardBusyId("");
    }
  };

  // ---- persist on change (after ready) ----
  useEffect(() => { if (ready) saveKey("dailyRecords", dailyRecords); }, [dailyRecords, ready]);
  useEffect(() => { if (ready) saveKey("holdings", holdings); }, [holdings, ready]);
  useEffect(() => { if (ready) saveKey("trades", trades); }, [trades, ready]);
  useEffect(() => { if (ready) saveKey("dividends", dividends); }, [dividends, ready]);
  useEffect(() => { if (ready) saveKey("planItems", planItems); }, [planItems, ready]);
  useEffect(() => { if (ready) saveKey("goal", goal); }, [goal, ready]);
  useEffect(() => { if (ready) saveKey("planSchedule", planSchedule); }, [planSchedule, ready]);
  useEffect(() => { if (ready) saveKey("costBasis", costBasis); }, [costBasis, ready]);
  useEffect(() => { if (ready) saveKey("aiFallbackConfig", aiFallbackConfig); }, [aiFallbackConfig, ready]);


  // ---- full backup / restore ----
  const exportBackup = () => {
    const exportedAt = new Date().toISOString();
    const payload = {
      app: "存股資產追蹤",
      appVersion: APP_VERSION,
      schemaVersion: BACKUP_SCHEMA_VERSION,
      exportedAt,
      data: { dailyRecords, holdings, trades, dividends, planItems, goal, planSchedule, costBasis },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `存股資產追蹤_備份_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setLastBackupAt(exportedAt);
    saveKey("lastBackupAt", exportedAt);
  };

  const exportExcel = async () => {
    let XLSX;
    try {
      XLSX = await loadXLSXLibrary();
    } catch (e) {
      window.alert("Excel 匯出元件載入失敗，請確認網路後再試一次。");
      return;
    }

    const wb = XLSX.utils.book_new();

    const dailyRows = [...dailyRecords]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((r) => ({
        日期: r.date,
        台股市值: Number(r.twValue || 0),
        美股市值: Number(r.usValue || 0),
        總市值: Number(r.twValue || 0) + Number(r.usValue || 0),
        台股成本: Number(r.twCost || 0),
        美股成本: Number(r.usCost || 0),
        總成本: Number(r.twCost || 0) + Number(r.usCost || 0),
      }));

    const tradeRows = [...trades]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((t) => ({
        日期: t.date,
        代號: t.symbol,
        買賣: t.action === "buy" ? "買" : "賣",
        股數: Number(t.shares || 0),
        成交價: Number(t.price || 0),
        手續費: Number(t.fee || 0),
        交易稅: Number(t.tax || 0),
        交易金額: Number(t.amount || 0),
        備註: t.note || "",
      }));

    const dividendRows = [...dividends]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((d) => ({
        除息日: d.date,
        代號: d.symbol,
        股數: Number(d.shares || 0),
        每股配息: Number(d.perShare || 0),
        配息總額: Number(d.amount || 0),
      }));

    const holdingRows = holdings.map((h) => {
      const netShares = trades
        .filter((t) => t.symbol === h.symbol)
        .reduce((sum, t) => sum + (t.action === "buy" ? Number(t.shares || 0) : -Number(t.shares || 0)), 0);
      const current = Number(h.initialShares || 0) + netShares;
      const target = Number(h.target2035 || 0);
      return {
        代號: h.symbol,
        名稱: h.name || "",
        期初股數: Number(h.initialShares || 0),
        目前股數: current,
        "2035目標股數": target,
        尚缺股數: Math.max(0, target - current),
        達成率: target > 0 ? current / target : 0,
      };
    });

    const planRows = planItems.map((p) => ({
      代號: p.symbol,
      每月投入: Number(p.amount || 0),
      備註: p.note || "",
    }));

    const summaryRows = [
      { 項目: "匯出日期", 資料: todayStr() },
      { 項目: "App版本", 資料: APP_VERSION },
      { 項目: "退休目標金額", 資料: Number(goal.targetAmount || 0) },
      { 項目: "退休目標年份", 資料: Number(goal.targetYear || 0) },
      { 項目: "起始成本", 資料: Number(costBasis?.startingCost || 0) },
      { 項目: "目前累積成本", 資料: Number(accumulatedCost || 0) },
      { 項目: "累積配息", 資料: dividends.reduce((sum, d) => sum + Number(d.amount || 0), 0) },
    ];

    const addSheet = (name, rows, widths) => {
      const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 資料: "尚無紀錄" }]);
      if (widths) ws["!cols"] = widths.map((wch) => ({ wch }));
      XLSX.utils.book_append_sheet(wb, ws, name);
    };

    addSheet("摘要", summaryRows, [20, 20]);
    addSheet("每日紀錄", dailyRows, [12, 14, 14, 14, 14, 14, 14]);
    addSheet("交易紀錄", tradeRows, [12, 10, 8, 10, 10, 10, 10, 14, 28]);
    addSheet("配息紀錄", dividendRows, [12, 10, 12, 12, 14]);
    addSheet("持股進度", holdingRows, [10, 18, 12, 12, 14, 12, 12]);
    addSheet("計畫設定", planRows, [10, 14, 28]);

    // 持股進度的達成率欄改成 Excel 百分比格式。
    const holdingSheet = wb.Sheets["持股進度"];
    if (holdingSheet && holdingRows.length) {
      for (let row = 2; row <= holdingRows.length + 1; row++) {
        const cell = holdingSheet[`G${row}`];
        if (cell) cell.z = "0.0%";
      }
    }

    XLSX.writeFile(wb, `存股資產追蹤_${todayStr()}.xlsx`);
  };

  const importBackup = async (file) => {
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      const check = inspectBackupPayload(payload);
      if (!check.ok) {
        const shown = check.errors.slice(0, 8).map((x) => `• ${x}`).join("\n");
        const more = check.errors.length > 8 ? `\n…另有 ${check.errors.length - 8} 項` : "";
        window.alert(`備份檔深度驗證失敗，資料未變更。\n\n${shown}${more}`);
        return;
      }
      if (check.warnings.length) {
        const shown = check.warnings.map((x) => `• ${x}`).join("\n");
        if (!window.confirm(`備份檔可匯入，但有提醒：\n\n${shown}\n\n仍要繼續嗎？`)) return;
      }
      if (!window.confirm("匯入會以備份內容取代目前 App 內的資料，確定要繼續嗎？")) return;
      const data = check.data;
      setDailyRecords(data.dailyRecords);
      setHoldings(data.holdings);
      setTrades(data.trades);
      setDividends(data.dividends);
      setPlanItems(data.planItems);
      setGoal(data.goal);
      const defaultPs = defaultPlanSchedule();
      const importedPs = data.planSchedule || {};
      setPlanSchedule({
        ...defaultPs,
        ...importedPs,
        initialPrincipal: Number(importedPs.initialPrincipal ?? importedPs.initialCapital ?? defaultPs.initialPrincipal),
        initialAssets: Number(importedPs.initialAssets ?? importedPs.initialCapital ?? defaultPs.initialAssets),
      });
      // schema 1 沒有 costBasis；保留目前值，不用 0 覆蓋。schema 2 才完整還原。
      if (check.schemaVersion >= 2 && isObject(data.costBasis)) setCostBasis(data.costBasis);
      if (typeof payload.exportedAt === "string" && Number.isFinite(Date.parse(payload.exportedAt))) {
        setLastBackupAt(payload.exportedAt);
        saveKey("lastBackupAt", payload.exportedAt);
      }
      window.alert(`備份已匯入完成（schema ${check.schemaVersion}）。建議重新整理一次頁面確認資料。`);
    } catch (e) {
      console.error("backup import failed", e);
      window.alert("備份檔讀取失敗，資料未變更。");
    }
  };

  // ---- derived ----
  const sortedDaily = useMemo(
    () => [...dailyRecords].sort((a, b) => a.date.localeCompare(b.date)),
    [dailyRecords]
  );
  const latest = sortedDaily[sortedDaily.length - 1];
  const prev = sortedDaily[sortedDaily.length - 2];
  const totalToday = latest ? latest.twValue + latest.usValue : 0;
  const totalPrev = prev ? prev.twValue + prev.usValue : null;
  const dailyChange = totalPrev != null ? totalToday - totalPrev : 0;
  const dailyChangePct = totalPrev ? (dailyChange / totalPrev) * 100 : 0;

  const tradesInvested = trades.reduce(
    (s, t) => s + (t.action === "buy" ? t.amount : -t.amount), 0
  );
  // Running cost basis: starting cost plus every buy (+) / sell (-) since.
  const accumulatedCost = Number(costBasis.startingCost || 0) + tradesInvested;
  // 目前持倉成本優先取自「每日紀錄」的台股成本+美股成本
  // 沒有填成本欄位時，才退回用交易紀錄淨買入金額估算
  const latestCost = latest ? (latest.twCost || 0) + (latest.usCost || 0) : 0;
  const totalInvested = latestCost > 0 ? latestCost : tradesInvested;
  const totalDividends = dividends.reduce((s, d) => s + d.amount, 0);
  const capitalGain = totalToday - totalInvested;
  const totalReturn = capitalGain + totalDividends;
  const totalReturnPct = totalInvested ? (totalReturn / totalInvested) * 100 : 0;

  const highPoint = sortedDaily.reduce((max, r) => {
    const v = r.twValue + r.usValue;
    return v > max.value ? { value: v, date: r.date } : max;
  }, { value: -Infinity, date: null });
  const drawdown = highPoint.value > 0 ? ((totalToday - highPoint.value) / highPoint.value) * 100 : 0;

  const chartData = sortedDaily.map((r) => ({
    date: r.date.slice(2),
    t: new Date(r.date).getTime(),
    total: r.twValue + r.usValue,
  }));

  // 昨日台股市值：抓最近一筆日期在「今天」之前的每日紀錄的 twValue。
  // 用來在「即時股價」面板算「今/昨日盈虧」——比較的是你自己台股持股的市值，
  // 不是單一股票的漲跌幅。
  const yesterdayTwRecord = [...sortedDaily].reverse().find((r) => r.date < todayStr());
  const yesterdayTwValue = yesterdayTwRecord ? yesterdayTwRecord.twValue : null;

  // "今年資產變化(YTD)" — market-value change since the start of the current
  // calendar year. Like the other stat cards, this is value-based, not a
  // cost-adjusted/time-weighted return: it doesn't separate new
  // contributions from investment gains. Baseline is the last record on or
  // before Jan 1 of this year; if tracking only started sometime this year,
  // falls back to the very first record so the number stays meaningful.
  const ytdBase = (() => {
    const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
    let base = null;
    for (let i = chartData.length - 1; i >= 0; i--) {
      if (chartData[i].t <= yearStart) { base = chartData[i]; break; }
    }
    return base || chartData[0] || null;
  })();
  const ytdGain = ytdBase ? totalToday - ytdBase.total : 0;
  const ytdPct = ytdBase && ytdBase.total ? (ytdGain / ytdBase.total) * 100 : 0;

  const holdingsWithShares = useMemo(() => holdings.map((h) => {
    const bought = trades.filter((t) => t.symbol === h.symbol && t.action === "buy")
      .reduce((s, t) => s + t.shares, 0);
    const sold = trades.filter((t) => t.symbol === h.symbol && t.action === "sell")
      .reduce((s, t) => s + t.shares, 0);
    const current = h.initialShares + bought - sold;
    const pct = h.target2035 ? Math.min(100, (current / h.target2035) * 100) : 0;

    // 用「移動加權平均法」依交易紀錄算出平均成本（自動）：
    // 買進時把成本併入、股數增加；賣出時依當下平均成本按比例扣除。
    // 注意：期初股數（initialShares）本身沒有記錄成本，這裡只根據交易紀錄計算，
    // 所以自動算出的均價僅供參考，可能跟實際成本對不起來。
    const symbolTrades = trades
      .filter((t) => t.symbol === h.symbol)
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date));

    let runningShares = 0, runningCost = 0;
    let runningSharesNoFee = 0, runningCostNoFee = 0; // 不含手續費，算「平均成交價」用
    for (const t of symbolTrades) {
      if (t.action === "buy") {
        runningCost += t.shares * t.price + Number(t.fee || 0);
        runningShares += t.shares;

        runningCostNoFee += t.shares * t.price;
        runningSharesNoFee += t.shares;
      } else {
        if (runningShares > 0) {
          const avgPerShare = runningCost / runningShares;
          const sellShares = Math.min(t.shares, runningShares);
          runningCost -= avgPerShare * sellShares;
          runningShares -= sellShares;
        }
        if (runningSharesNoFee > 0) {
          const avgPerShareNoFee = runningCostNoFee / runningSharesNoFee;
          const sellSharesNoFee = Math.min(t.shares, runningSharesNoFee);
          runningCostNoFee -= avgPerShareNoFee * sellSharesNoFee;
          runningSharesNoFee -= sellSharesNoFee;
        }
      }
    }
    const autoAvgCost = runningShares > 0 ? runningCost / runningShares : null;
    const avgTradePrice = runningSharesNoFee > 0 ? runningCostNoFee / runningSharesNoFee : null; // 不含手續費的成交均價

    // 若有手動填「平均成本」，優先用手動值；否則用交易紀錄自動算出的均價。
    // 持有成本一律用這個平均成本 × 目前股數算出，兩個數字才會對得起來。
    const manualAvgCost = Number(h.manualAvgCost);
    const hasManualAvgCost = h.manualAvgCost !== undefined && h.manualAvgCost !== "" && Number.isFinite(manualAvgCost) && manualAvgCost > 0;
    const avgCost = hasManualAvgCost ? manualAvgCost : autoAvgCost;
    const estCostBasis = avgCost != null ? Math.round(avgCost * current) : null;

    // 本季（自然季度：1-3月/4-6月/7-9月/10-12月）淨增加股數，過季就歸零重算。
    const now = new Date();
    const qStartMonth = Math.floor(now.getMonth() / 3) * 3; // 0, 3, 6, 9
    const quarterStartStr = `${now.getFullYear()}-${String(qStartMonth + 1).padStart(2, "0")}-01`;
    const quarterNum = qStartMonth / 3 + 1;
    const quarterSharesAdded = symbolTrades
      .filter((t) => t.date >= quarterStartStr)
      .reduce((s, t) => s + (t.action === "buy" ? t.shares : -t.shares), 0);

    // 今年累計（自然年：1/1 起算）淨增加股數，跨年就歸零重算。
    const yearStartStr = `${now.getFullYear()}-01-01`;
    const yearSharesAdded = symbolTrades
      .filter((t) => t.date >= yearStartStr)
      .reduce((s, t) => s + (t.action === "buy" ? t.shares : -t.shares), 0);

    // 推估離目標股數還要多久：用「從第一筆交易到今天」的實際淨增加股數，
    // 算出平均每月增加速度，再用剩餘股數 ÷ 這個速度，推算預估達成日期（精確到日）。
    // 完全依實際交易紀錄，不是用假設報酬率或投入金額去猜。
    let projectedLabel = null;
    if (h.target2035 > 0) {
      if (current >= h.target2035) {
        projectedLabel = "已達成";
      } else if (symbolTrades.length > 0) {
        const firstTradeDate = new Date(symbolTrades[0].date);
        const daysSpan = Math.max(1, (now - firstTradeDate) / 86400000);
        const monthsSpan = Math.max(1 / 30.44, daysSpan / 30.44); // 至少抓約1天，避免除以0
        const netFromTrades = bought - sold;
        const monthlyPace = netFromTrades / monthsSpan;
        if (monthlyPace > 0) {
          const remaining = h.target2035 - current;
          const monthsNeeded = remaining / monthlyPace;
          const target = new Date(now.getTime() + monthsNeeded * 30.44 * 86400000);
          const y = target.getFullYear();
          const m = String(target.getMonth() + 1).padStart(2, "0");
          projectedLabel = `預定 ${y}/${m}`;
        } else {
          projectedLabel = "無法推估";
        }
      } else {
        projectedLabel = "無法推估";
      }
    }

    return {
      ...h, bought, sold, current, pct, avgCost, estCostBasis, isManualAvgCost: hasManualAvgCost, avgTradePrice,
      quarterSharesAdded, quarterNum, yearSharesAdded, projectedLabel,
    };
  }), [holdings, trades]);

  const planTotal = planItems.reduce((s, p) => s + Number(p.amount || 0), 0);

  const schedule = useMemo(() => buildSchedule(planSchedule), [planSchedule]);
  const principalCrossing = useMemo(
    () => findCrossing(schedule, "principal", totalInvested), [schedule, totalInvested]
  );
  const assetCrossing = useMemo(
    () => findCrossing(schedule, "assets", totalToday), [schedule, totalToday]
  );
  // Same schedule, but against the stated goal amount instead of today's
  // asset total — gives an estimated goal-completion date to show in the
  // header, reusing the same projection already used in "計畫進度".
  const goalCrossing = useMemo(
    () => findCrossing(schedule, "assets", goal.targetAmount), [schedule, goal.targetAmount]
  );
  const goalDate = goalCrossing && !goalCrossing.beyond
    ? addMonths(planSchedule.startDate, goalCrossing.index) : null;
  const elapsedMonths = monthsBetween(planSchedule.startDate, latest ? latest.date : todayStr());
  const leadMonths = (principalCrossing && assetCrossing)
    ? principalCrossing.index - assetCrossing.index : null;

  // Milestone celebration: show a one-time toast the first time total assets
  // cross 50% / 80% / 100% of the goal. celebratedMilestones is persisted so
  // it doesn't fire again on every reload once a milestone has been hit.
  const [celebratedMilestones, setCelebratedMilestones] = useState(null); // null = not loaded yet
  const [celebration, setCelebration] = useState(null);
  useEffect(() => {
    (async () => {
      const saved = await loadKey("celebratedMilestones", []);
      setCelebratedMilestones(saved);
    })();
  }, []);
  useEffect(() => {
    if (!ready || celebratedMilestones === null || !goal.targetAmount) return;
    const pct = (totalToday / goal.targetAmount) * 100;
    const milestones = [50, 80, 100];
    const next = milestones.find((m) => pct >= m && !celebratedMilestones.includes(m));
    if (next) {
      const updated = [...celebratedMilestones, next];
      setCelebratedMilestones(updated);
      saveKey("celebratedMilestones", updated);
      setCelebration(next);
      setTimeout(() => setCelebration(null), 3200);
    }
  }, [totalToday, goal.targetAmount, ready, celebratedMilestones]);

  const backupAgeDays = lastBackupAt && Number.isFinite(Date.parse(lastBackupAt))
    ? Math.max(0, Math.floor((Date.now() - Date.parse(lastBackupAt)) / 86400000))
    : null;
  const backupOverdue = backupAgeDays == null || backupAgeDays >= 7;

  // <main> 最小高度：量測 Header + TabBar 實際高度，讓每個分頁至少撐滿一個
  // 螢幕高度，不會因為內容多寡（例如「配息」頁常常內容很少）忽高忽低——
  // 這在剛做完的左右滑頁動畫下特別重要，不然兩頁高度差太多，切換時看起來
  // 會很不順。用實際量測、不是寫死一個數字，是因為 Header 高度本身會變
  // （備份逾期警告出現時會多一行），寫死的數字只要警告一跳出來就會不準。
  const headerRef = useRef(null);
  const tabBarRef = useRef(null);
  const [mainMinHeight, setMainMinHeight] = useState(null);

  useEffect(() => {
    const measure = () => {
      const headerH = headerRef.current?.offsetHeight || 0;
      const tabBarH = tabBarRef.current?.offsetHeight || 0;
      const viewportH = window.visualViewport?.height || window.innerHeight;
      setMainMinHeight(Math.max(0, viewportH - headerH - tabBarH));
    };
    measure();
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (ro && headerRef.current) ro.observe(headerRef.current);
    if (ro && tabBarRef.current) ro.observe(tabBarRef.current);
    window.addEventListener("resize", measure);
    window.visualViewport?.addEventListener("resize", measure);
    return () => {
      if (ro) ro.disconnect();
      window.removeEventListener("resize", measure);
      window.visualViewport?.removeEventListener("resize", measure);
    };
  }, [backupOverdue]);

  if (!ready) {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.sub }}
        className="min-h-screen flex items-center justify-center gap-2 font-sans">
        <Loader2 className="animate-spin" size={20} />
        <span>載入中…</span>
      </div>
    );
  }

  return (
    <div style={{ background: COLORS.bg, color: COLORS.text }}
      className="min-h-screen font-sans pb-24">
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
        * { font-family: 'Noto Sans TC', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes celebrate-in {
          0% { opacity: 0; transform: translate(-50%, -12px) scale(0.9); }
          100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
      `}</style>

      {celebration && (
        <div className="fixed top-4 left-1/2 z-50 px-5 py-3 rounded-2xl text-sm font-bold flex items-center gap-2"
          style={{
            transform: "translateX(-50%)", background: COLORS.gold, color: COLORS.bg,
            boxShadow: "0 8px 24px rgba(0,0,0,0.4)", animation: "celebrate-in 0.35s ease-out",
          }}>
          🎉 已達成目標 {celebration}%！
        </div>
      )}

      <div ref={headerRef}>
        <Header goal={goal} totalToday={totalToday} goalDate={goalDate} backupOverdue={backupOverdue} backupAgeDays={backupAgeDays} />
      </div>

      <main
        className="relative px-4 pt-4 pb-24 max-w-2xl mx-auto overflow-x-hidden"
        style={{ touchAction: "pan-y", ...(mainMinHeight != null ? { minHeight: `${mainMinHeight}px` } : {}) }}
        onTouchStart={onPageTouchStart}
        onTouchEnd={onPageTouchEnd}
      >
        {(() => {
          const renderTabContent = (id) => {
            switch (id) {
              case "dashboard":
                return (
                  <Dashboard
                    totalToday={totalToday} dailyChange={dailyChange} dailyChangePct={dailyChangePct}
                    capitalGain={capitalGain} totalDividends={totalDividends} totalReturn={totalReturn}
                    totalReturnPct={totalReturnPct} highPoint={highPoint} drawdown={drawdown}
                    ytdGain={ytdGain} ytdPct={ytdPct}
                    chartData={chartData} goal={goal} totalInvested={totalInvested}
                    holdings={holdingsWithShares} yesterdayTwValue={yesterdayTwValue}
                    onFillDailyTw={(value) => { setDailyPrefill({ twValue: value, nonce: Date.now() }); goToTab("daily"); }}
                  />
                );
              case "daily":
                return (
                  <DailyPanel records={sortedDaily} setRecords={setDailyRecords} prefill={dailyPrefill}
                    form={dailyForm} setForm={setDailyForm} />
                );
              case "holdings":
                return (
                  <HoldingsPanel holdings={holdingsWithShares} setHoldings={setHoldings} />
                );
              case "trades":
                return (
                  <TradesPanel trades={trades} setTrades={setTrades} holdings={holdings}
                    costBasis={costBasis} setCostBasis={setCostBasis} accumulatedCost={accumulatedCost}
                    onFillDailyCost={(value) => { setDailyPrefill({ twCost: value, nonce: Date.now() }); goToTab("daily"); }}
                  />
                );
              case "dividends":
                return (
                  <DividendsPanel dividends={dividends} setDividends={setDividends} holdings={holdingsWithShares} />
                );
              case "plan":
                return (
                  <PlanPanel planItems={planItems} setPlanItems={setPlanItems}
                    planTotal={planTotal} goal={goal} setGoal={setGoal}
                    exportBackup={exportBackup} importBackup={importBackup} exportExcel={exportExcel} lastBackupAt={lastBackupAt} backupAgeDays={backupAgeDays} backupOverdue={backupOverdue}
                    aiFallbackConfig={aiFallbackConfig} setAiFallbackConfig={setAiFallbackConfig}
                    healthCards={healthCards} healthCardBusyId={healthCardBusyId} respondHealthCard={respondHealthCard} />
                );
              case "progress":
                return (
                  <ProgressPanel
                    planSchedule={planSchedule} setPlanSchedule={setPlanSchedule}
                    planTotal={planTotal} schedule={schedule}
                    totalInvested={totalInvested} totalToday={totalToday}
                    principalCrossing={principalCrossing} assetCrossing={assetCrossing}
                    elapsedMonths={elapsedMonths} leadMonths={leadMonths}
                  />
                );
              default:
                return null;
            }
          };
          // 兩種狀態（換頁動畫中／靜止）統一用同一組長條結構渲染，只差在靜止時
          // 長條只有一格、寬度 100%。這樣做是刻意的：如果動畫結束那一刻切去
          // 另一組完全不同的 DOM 結構，React 會認不出「這其實是同一個分頁」，
          // 直接把剛滑到的分頁整個重新掛載一次——如果那個分頁裡有圖表（像
          // 「總覽」的資產曲線），重新掛載就會讓圖表的進場動畫重播一次，
          // 看起來就是「滑到後閃一下」。每一格都加上 key={id}，讓 React
          // 兩種狀態之間能認出同一個分頁、不用重新掛載，這個閃爍就不會發生。
          const panelIds = transitionState
            ? (transitionState.dir === "left" ? [transitionState.from, transitionState.to] : [transitionState.to, transitionState.from])
            : [tab];
          const stripWidthPct = panelIds.length === 2 ? "200%" : "100%";
          const childWidthPct = panelIds.length === 2 ? "50%" : "100%";
          let offsetPct = "0%";
          if (transitionState) {
            const startOffset = transitionState.dir === "left" ? "0%" : "-50%";
            const endOffset = transitionState.dir === "left" ? "-50%" : "0%";
            offsetPct = settled ? endOffset : startOffset;
          }
          return (
            <div style={{ overflow: "hidden", position: "relative" }}>
              <div
                onTransitionEnd={(e) => {
                  if (e.propertyName === "transform" && transitionState) setTransitionState(null);
                }}
                style={{
                  display: "flex",
                  alignItems: "flex-start",
                  width: stripWidthPct,
                  transform: `translate3d(${offsetPct}, 0, 0)`,
                  transition: transitionState && settled ? "transform 0.28s cubic-bezier(.22,.61,.36,1)" : "none",
                  willChange: transitionState ? "transform" : "auto",
                  WebkitBackfaceVisibility: "hidden",
                  backfaceVisibility: "hidden",
                  WebkitPerspective: 1000,
                  perspective: 1000,
                }}>
                {panelIds.map((id) => (
                  <div key={id} style={{
                    width: childWidthPct, flexShrink: 0, minWidth: 0,
                    WebkitTransform: "translateZ(0)", transform: "translateZ(0)",
                  }}>
                    {renderTabContent(id)}
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </main>

      <AiChatWidget holdings={holdingsWithShares} goal={goal} totalToday={totalToday} totalInvested={totalInvested}
        trades={trades} setTrades={setTrades} setHoldings={setHoldings} setGoal={setGoal}
        dailyRecords={dailyRecords} dividends={dividends} planItems={planItems} planSchedule={planSchedule}
        goalDate={goalDate} aiFallbackConfig={aiFallbackConfig}
        perf={{
          capitalGain, totalDividends, totalReturn, totalReturnPct, highPoint, drawdown, ytdGain, ytdPct,
          elapsedMonths, leadMonths, startingCost: costBasis?.startingCost,
        }} />

      <TabBar tab={tab} setTab={goToTab} rootRef={tabBarRef} />
    </div>
  );
}

// ---------------- Header ----------------
function Header({ goal, totalToday, goalDate, backupOverdue, backupAgeDays }) {
  const remain = Math.max(0, goal.targetAmount - totalToday);
  const pct = Math.min(100, (totalToday / goal.targetAmount) * 100);
  return (
    <div
      className="px-4 pb-3"
      style={{
        borderBottom: `1px solid ${COLORS.panelBorder}`,
        // Header padding-top only needs to clear the safe-area notch/Dynamic
        // Island, not reproduce its full height as blank space above the
        // title. `env(safe-area-inset-top)` on iPhones with a notch/Dynamic
        // Island is typically 44–59px — subtracting only 4px left roughly a
        // line and a half of dead space above "存股資產追蹤". Subtracting
        // more claws that back, while `max(4px, ...)` keeps a small minimum
        // gap on devices with zero safe-area inset (Android, older iPhones)
        // so the title never touches the very top edge.
        paddingTop: "max(4px, calc(env(safe-area-inset-top, 0px) - 20px))",
      }}
    >
      <div className="max-w-2xl mx-auto">
        <div className="flex items-baseline justify-between">
          <h1 className="text-lg font-black tracking-tight" style={{ color: COLORS.gold }}>
            存股資產追蹤 <span className="text-[10px] font-medium" style={{ color: COLORS.sub }}>v{APP_VERSION}</span>
          </h1>
          <span className="text-xs mono" style={{ color: COLORS.sub }}>
            目標 {goal.targetYear} · {nf(goal.targetAmount)}
          </span>
        </div>
        <div className="mt-2 h-1.5 rounded-full overflow-hidden" style={{ background: COLORS.panel }}>
          <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: COLORS.gold }} />
        </div>
        <div className="mt-1 flex items-baseline justify-between text-[11px] mono" style={{ color: COLORS.sub }}>
          <span>距目標 NT${nf(remain)}（已達成 {pct.toFixed(1)}%）</span>
          {goalDate && <span style={{ color: COLORS.gold }}>預計 {goalDate} 達成</span>}
        </div>
        {backupOverdue && (
          <div className="mt-2 rounded-lg px-2.5 py-1.5 text-[10px] font-bold"
            style={{ color: COLORS.gold, background: COLORS.panel, border: `1px solid ${COLORS.gold}` }}>
            🔐 備份提醒：{backupAgeDays == null ? "尚未記錄 JSON 備份" : `上次備份已 ${backupAgeDays} 天前`}，建議到「計畫設定」匯出一份。
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------- News Carousel (dashboard) ----------------
// 只顯示「今天有新消息」的持股，逐則輪播；完全沒有任何新消息時整張卡片不渲染。
function NewsCarousel({ holdings }) {
  const [newsList, setNewsList] = useState([]);
  const [idx, setIdx] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const touchStartX = useRef(null);

  const activeHoldings = holdings.filter((h) => Number(h.current || 0) > 0 && h.symbol);
  const activeKey = activeHoldings.map((h) => h.symbol).sort().join(",");

  const buildFlatList = (newsBySymbol) => {
    const list = [];
    for (const h of activeHoldings) {
      const items = newsBySymbol[h.symbol];
      if (!items) continue;
      for (const it of items) list.push({ ...it, symbol: h.symbol, name: h.name });
    }
    return list;
  };

  useEffect(() => {
    let cancelled = false;
    (async () => {
      // 快取 3 小時內、且持股組合沒變就直接沿用，避免每次開 App 都重新打新聞來源。
      const cached = await loadKey("stockNews", null);
      const freshEnough = cached && cached.symbolsKey === activeKey &&
        (Date.now() - new Date(cached.at).getTime()) < 3 * 3600 * 1000;

      if (freshEnough) {
        if (!cancelled) { setNewsList(buildFlatList(cached.news || {})); setIdx(0); setLoaded(true); }
        return;
      }
      if (!activeHoldings.length) { if (!cancelled) setLoaded(true); return; }

      try {
        const news = await fetchStockNews(activeHoldings);
        const freshList = buildFlatList(news);

        if (freshList.length > 0) {
          // 有抓到新內容：顯示並更新快取。
          if (!cancelled) { setNewsList(freshList); setIdx(0); setLoaded(true); }
          saveKey("stockNews", { news, at: new Date().toISOString(), symbolsKey: activeKey });
        } else {
          // API 正常回應但暫時沒有新聞時，不要把畫面清空；優先沿用最後一次成功快取。
          // 這是之前新聞卡會突然整張消失的主要漏洞。
          const cachedList = cached ? buildFlatList(cached.news || {}) : [];
          if (!cancelled) { setNewsList(cachedList); setIdx(0); setLoaded(true); }
        }
      } catch (e) {
        // API 失敗也沿用最後一次成功快取；沒有快取才維持空白。
        const cachedList = cached ? buildFlatList(cached.news || {}) : [];
        if (!cancelled) { setNewsList(cachedList); setIdx(0); setLoaded(true); }
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeKey]);

  if (!loaded || newsList.length === 0) return null;

  const goTo = (i) => setIdx(((i % newsList.length) + newsList.length) % newsList.length);
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStartX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (dx > 40) goTo(idx - 1);
    else if (dx < -40) goTo(idx + 1);
    touchStartX.current = null;
  };

  const item = newsList[idx];

  return (
    <div data-no-page-swipe="true" className="rounded-2xl p-4" style={{
      background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`,
      boxShadow: "0 4px 16px rgba(0,0,0,0.28)",
    }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-1.5 text-xs" style={{ color: COLORS.sub }}>
          <Newspaper size={13} /> 持股新聞
        </div>
        {newsList.length > 1 && (
          <div className="flex items-center gap-2">
            <button onClick={() => goTo(idx - 1)} style={{ color: COLORS.sub }}><ChevronLeft size={16} /></button>
            <button onClick={() => goTo(idx + 1)} style={{ color: COLORS.sub }}><ChevronRight size={16} /></button>
          </div>
        )}
      </div>

      <div className="text-xs font-bold mono" style={{ color: COLORS.gold }}>{item.symbol}｜{item.name}</div>
      <div className="text-sm font-bold mt-1 leading-snug">{item.title}</div>
      <div className="text-[11px] mt-1.5" style={{ color: COLORS.sub }}>
        {item.source ? `${item.source} · ` : ""}{relativeTimeLabel(item.pubDate)}
      </div>

      <a href={item.link} target="_blank" rel="noreferrer"
        className="inline-flex items-center gap-1 mt-2.5 text-xs font-bold rounded-lg px-3 py-1.5"
        style={{ background: COLORS.gold, color: COLORS.bg }}>
        查看新聞 <ExternalLink size={12} />
      </a>

      {newsList.length > 1 && (
        <div className="flex justify-center gap-1.5 mt-3">
          {newsList.map((_, i) => (
            <div key={i} className="rounded-full" style={{
              width: i === idx ? 14 : 6, height: 6,
              background: i === idx ? COLORS.gold : COLORS.panelBorder,
              transition: "width 0.2s",
            }} />
          ))}
        </div>
      )}
    </div>
  );
}

// ---------------- Live Price Panel (dashboard) ----------------
function LivePricePanel({ holdings, onFillDailyTw, yesterdayTwValue }) {
  const [live, setLive] = useState({});      // symbol -> { price, prevClose, isUS, asOfDate, isStale }
  const [liveStatus, setLiveStatus] = useState("idle"); // idle | loading | done | error
  const [liveAt, setLiveAt] = useState(null);
  const [failedSymbols, setFailedSymbols] = useState([]);
  const [marketIndex, setMarketIndex] = useState(null); // { price, prevClose, ... } 加權指數
  const [cacheLoaded, setCacheLoaded] = useState(false);
  const liveRef = useRef({});
  const isFetchingRef = useRef(false);
  const lastFetchAtRef = useRef(0);

  useEffect(() => {
    liveRef.current = live;
  }, [live]);

  // Dynamic watchlist: fetch every Taiwan holding whose current share count
  // is greater than zero. Add/sell holdings in the app and this list follows
  // automatically — no symbol needs to be hardcoded here.
  const activeHoldings = holdings.filter((h) => Number(h.current || 0) > 0 && h.symbol);
  // Auto-refresh reads this ref instead of closing over `activeHoldings`
  // directly, so an interval set up before you add/remove a holding still
  // fetches the current list instead of the one from when it was created.
  const activeRef = useRef(activeHoldings);
  useEffect(() => {
    activeRef.current = activeHoldings;
  });
  // A stable key so the auto-refresh effect only resets its interval when
  // the set of symbols actually changes, not on every render.
  const activeSymbolsKey = activeHoldings.map((h) => h.symbol).sort().join(",");

  // On first mount, load whatever was fetched last time from storage so
  // switching tabs or reopening the app shows the last known prices right
  // away instead of an empty panel that has to fetch from scratch again.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const cached = await loadKey("livePrices", null);
      if (cancelled || !cached) { setCacheLoaded(true); return; }
      const revived = {};
      Object.entries(cached.map || {}).forEach(([sym, v]) => {
        revived[sym] = { ...v, asOfDate: v.asOfDate ? new Date(v.asOfDate) : null };
      });
      liveRef.current = revived;
      setLive(revived);
      setFailedSymbols(cached.failedSymbols || []);
      if (cached.marketIndex) {
        setMarketIndex({
          ...cached.marketIndex,
          asOfDate: cached.marketIndex.asOfDate ? new Date(cached.marketIndex.asOfDate) : null,
        });
      }
      const cachedAt = cached.at ? new Date(cached.at) : null;
      setLiveAt(cachedAt);
      if (cachedAt) lastFetchAtRef.current = cachedAt.getTime();
      setLiveStatus(Object.keys(revived).length ? "done" : "idle");
      setCacheLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  const fetchAllLive = async () => {
    const targets = activeRef.current;
    if (!targets.length) return;
    // Guard against overlap: if a previous run (manual or auto) is still
    // in-flight, skip this tick instead of firing a duplicate API request.
    if (isFetchingRef.current) return;
    isFetchingRef.current = true;
    setLiveStatus("loading");
    const symbols = targets.map((h) => h.symbol);
    const requestSymbols = [...symbols, "TAIEX"];
    let quoteResult = null;
    let quotes = null;
    try {
      try {
        quoteResult = await fetchQuotesWithFallback(requestSymbols);
        quotes = quoteResult.quotes;
      } catch (e) {
        // One retry after a short pause — a brief TWSE/API hiccup
        // shouldn't fail the whole refresh.
        await new Promise((res) => setTimeout(res, 800));
        quoteResult = await fetchQuotesWithFallback(requestSymbols);
        quotes = quoteResult.quotes;
      }
    } catch (e) {
      quotes = null;
    }
    const allMissing = quoteResult?.missing || requestSymbols.filter((s) => !quotes || !quotes[s]);
    // 大盤抓不到不能影響「持股報價是否完整」與每日紀錄寫入。
    const failed = allMissing.filter((s) => s !== "TAIEX");
    const freshIndex = quotes?.TAIEX || null;
    const now = new Date();
    // Merge this refresh with the last known successful price for any
    // symbol that failed this round. This keeps the dashboard useful during
    // temporary proxy/API hiccups instead of making that holding disappear.
    const mergedMap = {};
    targets.forEach((h) => {
      if (quotes && quotes[h.symbol]) {
        // Stamp with "now" only for a genuinely fresh fetch this round.
        mergedMap[h.symbol] = { ...quotes[h.symbol], fetchedAt: now.toISOString() };
      } else if (liveRef.current[h.symbol]) {
        // Carry over the old entry as-is, fetchedAt included — so the UI
        // can tell "this is what we showed last time" from "this just came in".
        mergedMap[h.symbol] = liveRef.current[h.symbol];
      }
    });
    liveRef.current = mergedMap;
    setLive(mergedMap);
    setFailedSymbols(failed);
    if (freshIndex) {
      setMarketIndex({ ...freshIndex, fetchedAt: now.toISOString() });
    }
    setLiveStatus(Object.keys(mergedMap).length ? "done" : "error");
    setLiveAt(now);
    lastFetchAtRef.current = now.getTime();
    // Persist the merged map so failed symbols also survive an app reopen.
    if (Object.keys(mergedMap).length) {
      const indexForCache = freshIndex
        ? { ...freshIndex, fetchedAt: now.toISOString() }
        : marketIndex;
      saveKey("livePrices", {
        map: mergedMap,
        failedSymbols: failed,
        marketIndex: indexForCache || null,
        at: now.toISOString(),
      });
      window.dispatchEvent(new CustomEvent("livePricesUpdated", { detail: { map: mergedMap } }));
    }
    isFetchingRef.current = false;
  };

  // Auto-refresh when the panel is ready, then every 15 seconds — but only
  // during TWSE trading hours. Outside those hours the price wouldn't be
  // changing anyway, so this avoids hitting the price source for nothing
  // all evening/overnight/weekends — it falls back to fully manual then.
  // The manual "抓取即時股價" button is unaffected by this — you can still
  // press it any time to check the last close. If we just loaded a cache
  // that's still fresh (e.g. you switched tabs and back within a few
  // seconds), skip the immediate refetch and just let the interval pick up
  // from there. The effect keys off activeSymbolsKey (not the array itself)
  // so it resets the interval when holdings actually change, not on every
  // render.
  useEffect(() => {
    if (!cacheLoaded || !activeSymbolsKey) return;
    const isFresh = Date.now() - lastFetchAtRef.current < 12000;
    if (!isFresh && isTwseTradingHours()) fetchAllLive();
    const timer = setInterval(() => {
      if (isTwseTradingHours()) fetchAllLive();
    }, 15000);
    return () => clearInterval(timer);
  }, [cacheLoaded, activeSymbolsKey]);

  const rows = activeHoldings.map((h) => {
    const l = live[h.symbol];
    if (!l) return null;
    const chg = l.price - l.prevClose;
    const chgPct = l.prevClose ? (chg / l.prevClose) * 100 : 0;
    const value = l.price * h.current;
    const isFromCache = failedSymbols.includes(h.symbol);
    const quoteIsStale = Boolean(l.isStale);
    return { ...h, price: l.price, chg, chgPct, value, isUS: l.isUS, fetchedAt: l.fetchedAt, isFromCache, quoteIsStale };
  }).filter(Boolean);

  const totalValue = rows.reduce((s, r) => s + r.value, 0);
  const hasLive = rows.length > 0;
  const quoteComplete = activeHoldings.length > 0
    && rows.length === activeHoldings.length
    && failedSymbols.length === 0
    && rows.every((r) => Number.isFinite(r.price) && r.price > 0 && !r.isFromCache);
  const staleOne = Object.values(live).find((l) => l.isStale && l.asOfDate);
  const indexPrice = Number(marketIndex?.price);
  const indexPrevClose = Number(marketIndex?.prevClose);
  const hasMarketIndex = Number.isFinite(indexPrice) && indexPrice > 0
    && Number.isFinite(indexPrevClose) && indexPrevClose > 0;
  const indexChange = hasMarketIndex ? indexPrice - indexPrevClose : 0;
  const indexChangePct = hasMarketIndex ? (indexChange / indexPrevClose) * 100 : null;
  const portfolioDayPct = yesterdayTwValue
    ? ((totalValue - yesterdayTwValue) / yesterdayTwValue) * 100
    : null;
  const vsMarketPct = portfolioDayPct != null && indexChangePct != null
    ? portfolioDayPct - indexChangePct
    : null;

  const recordToday = () => {
    if (!onFillDailyTw) return;
    if (!quoteComplete) {
      window.alert("目前報價只有部分成功或混有快取價格，為避免把不完整市值寫進每日紀錄，請先重新抓到全部持股報價。");
      return;
    }
    onFillDailyTw(Math.round(totalValue));
  };

  return (
    <Panel title="即時股價">
      <div className="flex items-center justify-between gap-2 mb-2">
        <div className="text-[11px]" style={{ color: COLORS.sub }}>
          {liveStatus === "idle" && `自動抓取目前持有的 ${activeHoldings.length} 檔台股（開盤時間每 15 秒更新，收盤後改手動）`}
          {liveStatus === "loading" && "更新中…"}
          {liveStatus === "done" && liveAt && (staleOne
            ? `休市中，顯示 ${staleOne.asOfDate.getFullYear()}/${String(staleOne.asOfDate.getMonth()+1).padStart(2,"0")}/${String(staleOne.asOfDate.getDate()).padStart(2,"0")} 收盤價（查詢 ${liveAt.toLocaleTimeString("zh-TW", { hour12: false })}）`
            : `已更新 ${liveAt.toLocaleTimeString("zh-TW", { hour12: false })}`)}
          {liveStatus === "error" && "抓取失敗（來源可能暫時壅塞），稍後再試或改用券商 App 查詢"}
        </div>
        <button
          onClick={fetchAllLive}
          disabled={liveStatus === "loading" || !activeHoldings.length}
          className="text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 flex-shrink-0"
          style={{ background: COLORS.gold, color: COLORS.bg, opacity: (liveStatus === "loading" || !activeHoldings.length) ? 0.5 : 1 }}
        >
          {liveStatus === "loading" ? <Loader2 size={13} className="animate-spin" /> : null}
          抓取即時股價
        </button>
      </div>

      {hasLive && (
        <div>
          <div className="grid grid-cols-4 gap-1 text-[10px] pb-1.5 mb-1.5" style={{ color: COLORS.sub, borderBottom: `1px solid ${COLORS.panelBorder}` }}>
            <span>代號</span>
            <span className="text-right">股價</span>
            <span className="text-right">漲跌幅</span>
            <span className="text-right">市值</span>
          </div>
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {rows.map((r) => (
              <div key={r.id}>
                <div className="grid grid-cols-4 gap-1 text-xs mono items-center">
                  <span style={{ color: COLORS.sub }}>{r.symbol}</span>
                  <span className="text-right">{r.price.toFixed(2)}</span>
                  <span className="text-right" style={{ color: r.quoteIsStale ? COLORS.sub : (r.chg >= 0 ? COLORS.gain : COLORS.loss) }}>
                    {r.quoteIsStale && isTwseTradingHours()
                      ? "待更新"
                      : <>{r.chg >= 0 ? "▲" : "▼"} {r.chgPct >= 0 ? "+" : ""}{r.chgPct.toFixed(2)}%</>}
                  </span>
                  <span className="text-right font-bold">{nf(r.value)}</span>
                </div>
                {!r.quoteIsStale && (
                  <div className="text-xs text-right mt-0.5" style={{ color: r.chg >= 0 ? COLORS.gain : COLORS.loss, opacity: 0.85 }}>
                    今日損益 {r.chg >= 0 ? "+" : ""}{nf(Math.round(r.chg * r.current))}
                  </div>
                )}
                {r.isFromCache && r.fetchedAt && (
                  <div className="text-[9px] text-right mt-0.5" style={{ color: COLORS.sub }}>
                    這次抓取失敗，顯示上次成功價格（{new Date(r.fetchedAt).toLocaleString("zh-TW", {
                      month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false,
                    })}）
                  </div>
                )}
              </div>
            ))}
          </div>
          <div className="flex justify-between text-xs mono pt-2 mt-2 font-bold" style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
            <span style={{ color: COLORS.sub }}>{quoteComplete ? "今日台股總市值" : "目前可得市值（部分）"}</span>
            <span style={{ color: COLORS.gold }}>NT$ {nf(totalValue)}</span>
          </div>
          {yesterdayTwValue != null && (
            <>
              <div className="flex justify-between text-xs mono mt-1">
                <span style={{ color: COLORS.sub }}>昨日台股總市值</span>
                <span style={{ color: COLORS.sub }}>NT$ {nf(yesterdayTwValue)}</span>
              </div>
              <div className="flex justify-between text-xs mono mt-1 font-bold">
                <span style={{ color: COLORS.sub }}>今/昨日盈虧</span>
                {(() => {
                  const diff = totalValue - yesterdayTwValue;
                  const diffPct = yesterdayTwValue ? (diff / yesterdayTwValue) * 100 : 0;
                  const up = diff >= 0;
                  return (
                    <span style={{ color: up ? COLORS.gain : COLORS.loss }}>
                      {up ? "+" : ""}{nf(diff)}（{up ? "+" : ""}{diffPct.toFixed(2)}%）
                    </span>
                  );
                })()}
              </div>
            </>
          )}
          {hasMarketIndex && (
            <>
              <div className="flex justify-between text-xs mono mt-1">
                <span style={{ color: COLORS.sub }}>加權指數</span>
                <span style={{ color: indexChange >= 0 ? COLORS.gain : COLORS.loss }}>
                  {nf(Math.round(indexPrice))}　{indexChange >= 0 ? "▲" : "▼"} {indexChangePct >= 0 ? "+" : ""}{indexChangePct.toFixed(2)}%
                </span>
              </div>
              {vsMarketPct != null && (
                <div className="flex justify-between text-xs mono mt-1">
                  <span style={{ color: COLORS.sub }}>今日 vs 大盤</span>
                  <span style={{ color: vsMarketPct >= 0 ? COLORS.gain : COLORS.loss }}>
                    {vsMarketPct >= 0 ? "贏大盤" : "輸大盤"} {vsMarketPct >= 0 ? "+" : ""}{vsMarketPct.toFixed(2)}%
                  </span>
                </div>
              )}
            </>
          )}
          {onFillDailyTw && (
            <>
              <button onClick={recordToday} disabled={!quoteComplete}
                className="mt-2 w-full rounded-lg py-2 text-[11px] font-bold"
                style={{ background: COLORS.bg, border: `1px solid ${quoteComplete ? COLORS.gold : COLORS.panelBorder}`, color: quoteComplete ? COLORS.gold : COLORS.sub, opacity: quoteComplete ? 1 : 0.6 }}>
                帶入「每日紀錄」台股市值
              </button>
              <div className="text-[10px] mt-1" style={{ color: COLORS.sub }}>
                {quoteComplete
                  ? "會跳到「每日紀錄」並自動填好台股市值，美股記得手動補上再儲存"
                  : "目前報價不完整：已禁止把部分市值寫入每日紀錄"}
              </div>
            </>
          )}
        </div>
      )}
      {liveStatus === "done" && failedSymbols.length > 0 && (
        <div className="text-[11px] mt-2" style={{ color: COLORS.loss }}>
          抓取失敗：{failedSymbols.join("、")}（來源暫時壅塞，可再按一次重試）
        </div>
      )}
      {!activeHoldings.length && <Empty text="請先到「持股進度」新增持股並填入股數，才能抓取即時股價" />}
    </Panel>
  );
}

  { id: "1m", label: "1個月", days: 30 },
  { id: "3m", label: "3個月", days: 90 },
  { id: "6m", label: "半年", days: 182 },

  // Defaults to "1年" rather than "全部": with 3+ sparse years plotted
  // proportionally to real time (see pickEvenTimeTicks above), the last
  // few months of daily-tracked detail — the part most people check day to
  // day — get compressed into a thin sliver on the full-history view. A
  // shorter default window shows that recent detail first; "全部" is one
  // tap away for anyone who wants the long-term shape.
  const [chartRangeId, setChartRangeId] = useState("1y");

    if (!range.days || chartData.length === 0) return chartData;
    const cutoff = chartData[chartData.length - 1].t - range.days * 24 * 60 * 60 * 1000;
    const filtered = chartData.filter((d) => d.t >= cutoff);
    // If the chosen window is shorter than the data actually goes back
    // (e.g. "1個月" on a brand-new tracker), fall back to everything rather
    // than showing a near-empty chart.
    return filtered.length > 1 ? filtered : chartData;

      {chartData.length > 1 && (
        <div className="rounded-2xl p-4" style={{

          boxShadow: "0 4px 16px rgba(0,0,0,0.28)",

          <div className="flex items-center justify-between mb-2">
            <div className="text-xs" style={{ color: COLORS.sub }}>資產曲線</div>
            <div className="flex gap-1">

                <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                <XAxis dataKey="t" type="number" domain={["dataMin", "dataMax"]}
                  tick={{ fontSize: 9, fill: COLORS.sub }}
                  ticks={pickEvenTimeTicks(rangedChartData, "t", 6)} tickFormatter={formatTickDate} />
                <YAxis tick={{ fontSize: 9, fill: COLORS.sub }}

                <Tooltip
                  labelFormatter={formatTickDate}

                <ReferenceLine y={goal.targetAmount} stroke={COLORS.gold} strokeDasharray="4 4" />
                <Line type="monotone" dataKey="total" stroke={COLORS.gold} strokeWidth={2} dot={false} />

      <div className="grid grid-cols-2 gap-3">
