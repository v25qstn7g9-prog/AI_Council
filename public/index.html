        <StatCard label="累積股息" value={`NT$ ${nf(totalDividends)}`} tone="gold" />
        <StatCard label="粗估總報酬" value={`NT$ ${nf(totalReturn)}`} tone={totalReturn >= 0 ? "gain" : "loss"} />
        <StatCard label="粗估報酬率" value={pf(totalReturnPct)} tone={totalReturnPct >= 0 ? "gain" : "loss"} />
        <StatCard label="今年資產變化(YTD)" value={`${nf(ytdGain)}（${pf(ytdPct)}）`} tone={ytdGain >= 0 ? "gain" : "loss"} className="col-span-2" />
      </div>
      <div className="text-[11px] px-1" style={{ color: COLORS.sub }}>
        註：目前成本來自券商/每日紀錄的持倉成本；若曾賣出、換股或用股息再投入，
        「粗估總報酬」不等同完整 XIRR 或全期間真實總報酬。

      <div className="rounded-2xl p-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>

        <div className="flex justify-between text-sm mono">
          <span style={{ color: COLORS.sub }}>{highPoint.date || "—"}</span>

        <div className="flex justify-between text-sm mono mt-1">

    </div>
  );

function StatCard({ label, value, tone, className = "" }) {
  const color = tone === "gain" ? COLORS.gain : tone === "loss" ? COLORS.loss : tone === "gold" ? COLORS.gold : COLORS.text;
  return (
    <div className={`rounded-2xl p-4 ${className}`} style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
      <div className="text-xs" style={{ color: COLORS.sub }}>{label}</div>
      <div className="text-lg font-bold mono mt-1" style={{ color }}>{value}</div>
    </div>
  );
}

// ---------------- Daily Panel ----------------
function DailyPanel({ records, setRecords, prefill, form, setForm }) {
  // When "帶入「每日紀錄」..." is pressed elsewhere in the app, prefill is
  // set to a fresh object each time — that reference change is what makes
  // this effect fire again even if the same value is sent twice. Only the
  // fields actually present on prefill get overwritten, so the market-value
  // button and the cost-basis button can each fill in just their own field.
  useEffect(() => {
    if (!prefill) return;
    setForm((f) => {
      const next = { ...f, date: todayStr() };
      if (prefill.twValue != null) next.twValue = String(prefill.twValue);
      if (prefill.twCost != null) next.twCost = String(prefill.twCost);
      return next;
    });
  }, [prefill]);
  const add = () => {
    const sameDayExists = records.some((x) => x.date === form.date);
    if (!sameDayExists && !form.twValue && !form.usValue) return;
    if (!form.twValue && !form.usValue && !form.twCost && !form.usCost) return;
    setRecords((r) => {
      const existing = r.find((x) => x.date === form.date);
      const keepOrNumber = (raw, key) => raw === "" || raw == null
        ? Number(existing?.[key] || 0)
        : Number(raw);
      const filtered = r.filter((x) => x.date !== form.date);
      return [...filtered, {
        id: existing?.id || uid(), date: form.date,
        twValue: keepOrNumber(form.twValue, "twValue"), usValue: keepOrNumber(form.usValue, "usValue"),
        twCost: keepOrNumber(form.twCost, "twCost"), usCost: keepOrNumber(form.usCost, "usCost"),
      }].sort((a, b) => a.date.localeCompare(b.date));
    });
    setForm({ date: todayStr(), twValue: "", usValue: "", twCost: "", usCost: "" });
  };
  const remove = (id) => setRecords((r) => r.filter((x) => x.id !== id));
  const sortedRecords = [...records].sort((a, b) => a.date.localeCompare(b.date));
  const reversed = [...sortedRecords].reverse();

  // Monthly summary: for each month, compare the last record of that month
  // against the last record before it (i.e. the prior month's closing
  // value) to get that month's gain/loss and return %. The very first
  // month in the whole history has no "before" record to compare against,
  // so it's left blank rather than showing a misleading 0%/100%.
  const monthlyStats = {};
  const monthKey = (d) => d.slice(0, 7); // "YYYY-MM"
  let lastSeenPerMonth = {};
  sortedRecords.forEach((r) => { lastSeenPerMonth[monthKey(r.date)] = r; });
  const monthKeys = Object.keys(lastSeenPerMonth).sort();
  monthKeys.forEach((mk, i) => {
    const endRec = lastSeenPerMonth[mk];
    const endValue = endRec.twValue + endRec.usValue;
    const endCost = (endRec.twCost || 0) + (endRec.usCost || 0);
    const prevMk = i > 0 ? monthKeys[i - 1] : null;
    if (!prevMk) { monthlyStats[mk] = null; return; }
    const startRec = lastSeenPerMonth[prevMk];
    const startValue = startRec.twValue + startRec.usValue;
    const startCost = (startRec.twCost || 0) + (startRec.usCost || 0);
    // Market return isolates actual investment performance from money you
    // added that month: compare unrealized gain (value − cost) at the
    // start vs end of the month, instead of comparing raw asset value
    // (which would count new contributions as if they were investment
    // gains). Contribution is the month's own number: how much your cost
    // basis grew, i.e. how much new money went in.
    // This only works if BOTH ends of the month have real cost data. If
    // cost tracking started partway through your history, one side will
    // read as 0 (not "genuinely zero cost", just "not filled in yet") —
    // using it anyway would misread that as a huge fake gain/loss for
    // whichever month straddles that transition. Fall back to the plain
    // value-based estimate for exactly that month instead.
    const hasCostBothEnds = startCost > 0 && endCost > 0;
    let marketReturn, pct, contribution;
    if (hasCostBothEnds) {
      marketReturn = (endValue - endCost) - (startValue - startCost);
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = endCost - startCost;
    } else {
      marketReturn = endValue - startValue;
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = null; // unknown split between market move and new money
    }
    monthlyStats[mk] = { marketReturn, pct, contribution, approximate: !hasCostBothEnds };
  });

  // Yearly summary: same market-return / contribution split as monthly
  // above, just grouped by year instead of month. Reuses the exact same
  // logic (and the same "no cost data on one side" fallback) so the
  // numbers here are directly comparable to the monthly breakdown.
  const yearlyStats = {};
  const yearKey = (d) => d.slice(0, 4); // "YYYY"
  let lastSeenPerYear = {};
  records.forEach((r) => { lastSeenPerYear[yearKey(r.date)] = r; });
  const yearKeys = Object.keys(lastSeenPerYear).sort();
  yearKeys.forEach((yk, i) => {
    const endRec = lastSeenPerYear[yk];
    const endValue = endRec.twValue + endRec.usValue;
    const endCost = (endRec.twCost || 0) + (endRec.usCost || 0);
    const prevYk = i > 0 ? yearKeys[i - 1] : null;
    if (!prevYk) { yearlyStats[yk] = null; return; }
    const startRec = lastSeenPerYear[prevYk];
    const startValue = startRec.twValue + startRec.usValue;
    const startCost = (startRec.twCost || 0) + (startRec.usCost || 0);
    const hasCostBothEnds = startCost > 0 && endCost > 0;
    let marketReturn, pct, contribution;
    if (hasCostBothEnds) {
      marketReturn = (endValue - endCost) - (startValue - startCost);
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = endCost - startCost;
    } else {
      marketReturn = endValue - startValue;
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = null;
    }
    yearlyStats[yk] = { marketReturn, pct, contribution, approximate: !hasCostBothEnds };
  });

  // Weekly summary: same market-return / contribution split as monthly and
  // yearly above, just grouped by ISO week (Monday-start) instead. Shown as
  // a horizontally swipeable strip of compact cards rather than a vertical
  // list — a full year of weekly data would make an very long list, and
  // weekly numbers are usually small day-to-day noise that's more useful to
  // skim sideways a few at a time than to scroll through in bulk.
  const mondayOf = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  };
  const weeklyStats = {};
  const weekKey = (d) => mondayOf(d);
  let lastSeenPerWeek = {};
  records.forEach((r) => { lastSeenPerWeek[weekKey(r.date)] = r; });
  const weekKeys = Object.keys(lastSeenPerWeek).sort();
  weekKeys.forEach((wk, i) => {
    const endRec = lastSeenPerWeek[wk];
    const endValue = endRec.twValue + endRec.usValue;
    const endCost = (endRec.twCost || 0) + (endRec.usCost || 0);
    const prevWk = i > 0 ? weekKeys[i - 1] : null;
    if (!prevWk) { weeklyStats[wk] = null; return; }
    const startRec = lastSeenPerWeek[prevWk];
    const startValue = startRec.twValue + startRec.usValue;
    const startCost = (startRec.twCost || 0) + (startRec.usCost || 0);
    const hasCostBothEnds = startCost > 0 && endCost > 0;
    let marketReturn, pct, contribution;
    if (hasCostBothEnds) {
      marketReturn = (endValue - endCost) - (startValue - startCost);
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = endCost - startCost;
    } else {
      marketReturn = endValue - startValue;
      pct = startValue ? (marketReturn / startValue) * 100 : 0;
      contribution = null;
    }
    weeklyStats[wk] = { marketReturn, pct, contribution, approximate: !hasCostBothEnds };
  });
  const weekLabel = (wk) => {
    const start = new Date(wk + "T00:00:00");
    const end = new Date(start); end.setDate(end.getDate() + 6);
    const fmt = (d) => `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    return `${fmt(start)}-${fmt(end)}`;
  };

  // 自訂區間查詢：找「這天或更早最近一筆」的紀錄來比對，因為使用者不一定每天都記錄，
  // 直接要求剛好命中那天太嚴格；用程式碼算，100% 準確，不會有 AI 抄錯數字的風險。
  const findRecordAtOrBefore = (dateStr) => {
    const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
    let found = null;
    for (const r of sorted) {
      if (r.date <= dateStr) found = r; else break;
    }
    return found;
  };
  const [rangeFrom, setRangeFrom] = useState("");
  const [rangeTo, setRangeTo] = useState("");
  const rangeResult = (rangeFrom && rangeTo) ? (() => {
    const fromRec = findRecordAtOrBefore(rangeFrom);
    const toRec = findRecordAtOrBefore(rangeTo);
    if (!fromRec || !toRec) return { error: "這個區間找不到對應的紀錄" };
    const fromValue = fromRec.twValue + fromRec.usValue;
    const toValue = toRec.twValue + toRec.usValue;
    const fromCost = (fromRec.twCost || 0) + (fromRec.usCost || 0);
    const toCost = (toRec.twCost || 0) + (toRec.usCost || 0);
    return {
      fromRec, toRec, fromValue, toValue, fromCost, toCost,
      assetChange: toValue - fromValue,
      costChange: toCost - fromCost,
      gainChange: (toValue - toCost) - (fromValue - fromCost),
      twValueChange: (toRec.twValue || 0) - (fromRec.twValue || 0),
      usValueChange: (toRec.usValue || 0) - (fromRec.usValue || 0),
      twCostChange: (toRec.twCost || 0) - (fromRec.twCost || 0),
      usCostChange: (toRec.usCost || 0) - (fromRec.usCost || 0),
    };
  })() : null;

  return (
    <div className="space-y-4">
      <Panel title="新增每日紀錄">
        <div className="grid grid-cols-2 gap-2">
          <Field label="日期"><input type="date" value={form.date}
            onChange={(e) => setForm({ ...form, date: e.target.value })}
            className="input" /></Field>
          <div />
          <Field label="台股市值"><input type="number" value={form.twValue}
            onChange={(e) => setForm({ ...form, twValue: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="美股市值"><input type="number" value={form.usValue}
            onChange={(e) => setForm({ ...form, usValue: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="台股成本"><input type="number" value={form.twCost}
            onChange={(e) => setForm({ ...form, twCost: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="美股成本"><input type="number" value={form.usCost}
            onChange={(e) => setForm({ ...form, usCost: e.target.value })}
            placeholder="0" className="input" /></Field>
        </div>
        <AddButton onClick={add} label="儲存紀錄" />
      </Panel>

      <Panel title="區間查詢（精算，非AI）">
        <div className="text-[11px] mb-2" style={{ color: COLORS.sub }}>
          選兩個日期，直接用你的原始紀錄計算資產/本金/損益變化，數字保證準確
        </div>
        <div className="grid grid-cols-2 gap-2">
          <Field label="起始日期"><input type="date" value={rangeFrom}
            onChange={(e) => setRangeFrom(e.target.value)} className="input" /></Field>
          <Field label="結束日期"><input type="date" value={rangeTo}
            onChange={(e) => setRangeTo(e.target.value)} className="input" /></Field>
        </div>
        {rangeResult && rangeResult.error && (
          <div className="text-xs mt-2" style={{ color: COLORS.loss }}>{rangeResult.error}</div>
        )}
        {rangeResult && !rangeResult.error && (
          <div className="mt-3 space-y-1.5 text-sm mono rounded-lg px-3 py-2.5"
            style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
            <div className="text-[10px]" style={{ color: COLORS.sub }}>
              實際比對：{rangeResult.fromRec.date}（起）→ {rangeResult.toRec.date}（迄）
              {(rangeResult.fromRec.date !== rangeFrom || rangeResult.toRec.date !== rangeTo)
                ? "（其中一天沒有剛好的紀錄，取最近一筆較早的紀錄代替）" : ""}
            </div>
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>總市值變化</span>
              <span className="font-bold" style={{ color: rangeResult.assetChange >= 0 ? COLORS.gain : COLORS.loss }}>
                {rangeResult.assetChange >= 0 ? "+" : ""}{nf(rangeResult.assetChange)}
              </span>
            </div>
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>總本金變化</span>
              <span className="font-bold" style={{ color: COLORS.gold }}>
                {rangeResult.costChange >= 0 ? "+" : ""}{nf(rangeResult.costChange)}
              </span>
            </div>
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>損益變化（市場報酬）</span>
              <span className="font-bold" style={{ color: rangeResult.gainChange >= 0 ? COLORS.gain : COLORS.loss }}>
                {rangeResult.gainChange >= 0 ? "+" : ""}{nf(rangeResult.gainChange)}
              </span>
            </div>
            <div style={{ borderTop: `1px solid ${COLORS.panelBorder}`, margin: "6px 0" }} />
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>台股市值變化</span>
              <span className="font-bold" style={{ color: rangeResult.twValueChange >= 0 ? COLORS.gain : COLORS.loss }}>
                {rangeResult.twValueChange >= 0 ? "+" : ""}{nf(rangeResult.twValueChange)}
              </span>
            </div>
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>台股本金變化</span>
              <span className="font-bold" style={{ color: COLORS.gold }}>
                {rangeResult.twCostChange >= 0 ? "+" : ""}{nf(rangeResult.twCostChange)}
              </span>
            </div>
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>美股市值變化</span>
              <span className="font-bold" style={{ color: rangeResult.usValueChange >= 0 ? COLORS.gain : COLORS.loss }}>
                {rangeResult.usValueChange >= 0 ? "+" : ""}{nf(rangeResult.usValueChange)}
              </span>
            </div>
            <div className="flex justify-between">
              <span style={{ color: COLORS.sub }}>美股本金變化</span>
              <span className="font-bold" style={{ color: COLORS.gold }}>
                {rangeResult.usCostChange >= 0 ? "+" : ""}{nf(rangeResult.usCostChange)}
              </span>
            </div>
          </div>
        )}
      </Panel>

      {weekKeys.length > 0 && (
        <Panel title="週度損益">
          {weekKeys.some((wk) => weeklyStats[wk]?.approximate) && (
            <div className="text-[10px] mb-2" style={{ color: COLORS.sub }}>
              * 成本資料不完整的週份，市場報酬與新增投入無法精準拆分，數字為粗估
            </div>
          )}
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {[...weekKeys].reverse().map((wk) => {
              const stat = weeklyStats[wk];
              return (
                <div key={wk} className="rounded-lg px-3 py-2 text-xs mono"
                  style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div className="flex justify-between items-baseline">
                    <span style={{ color: COLORS.sub }}>{weekLabel(wk)}{stat?.approximate ? " *" : ""}</span>
                    {stat ? (
                      <span className="font-bold" style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                        市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                      </span>
                    ) : (
                      <span style={{ color: COLORS.sub }}>最早紀錄，無前週可比較</span>
                    )}
                  </div>
                  {stat && stat.contribution != null && stat.contribution !== 0 && (
                    <div className="text-right mt-0.5" style={{ color: COLORS.gold }}>
                      新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {monthKeys.length > 0 && (
        <Panel title="月度損益">
          {monthKeys.some((mk) => monthlyStats[mk]?.approximate) && (
            <div className="text-[10px] mb-2" style={{ color: COLORS.sub }}>
              * 成本資料不完整的月份，市場報酬與新增投入無法精準拆分，數字為粗估
            </div>
          )}
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {[...monthKeys].reverse().map((mk) => {
              const stat = monthlyStats[mk];
              return (
                <div key={mk} className="rounded-lg px-3 py-2 text-xs mono"
                  style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div className="flex justify-between items-baseline">
                    <span style={{ color: COLORS.sub }}>{mk}{stat?.approximate ? " *" : ""}</span>
                    {stat ? (
                      <span className="font-bold" style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                        市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                      </span>
                    ) : (
                      <span style={{ color: COLORS.sub }}>最早紀錄，無前月可比較</span>
                    )}
                  </div>
                  {stat && stat.contribution != null && stat.contribution !== 0 && (
                    <div className="text-right mt-0.5" style={{ color: COLORS.gold }}>
                      新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {yearKeys.length > 0 && (
        <Panel title="年度損益">
          {yearKeys.some((yk) => yearlyStats[yk]?.approximate) && (
            <div className="text-[10px] mb-2" style={{ color: COLORS.sub }}>
              * 成本資料不完整的年份，市場報酬與新增投入無法精準拆分，數字為粗估
            </div>
          )}
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {[...yearKeys].reverse().map((yk) => {
              const stat = yearlyStats[yk];
              return (
                <div key={yk} className="rounded-lg px-3 py-2 text-xs mono"
                  style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div className="flex justify-between items-baseline">
                    <span style={{ color: COLORS.sub }}>{yk}{stat?.approximate ? " *" : ""}</span>
                    {stat ? (
                      <span className="font-bold" style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                        市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                      </span>
                    ) : (
                      <span style={{ color: COLORS.sub }}>最早紀錄，無前年可比較</span>
                    )}
                  </div>
                  {stat && stat.contribution != null && stat.contribution !== 0 && (
                    <div className="text-right mt-0.5" style={{ color: COLORS.gold }}>
                      新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}


      <Panel title={`歷史紀錄（${records.length}）`}>
        <div className="space-y-2 max-h-[30rem] overflow-y-auto">
          {(() => {
            let lastMonth = null;
            return reversed.map((r, i) => {
              const total = r.twValue + r.usValue;
              const totalCost = (r.twCost || 0) + (r.usCost || 0);
              const prevRec = records[records.length - 2 - i];
              const diff = prevRec ? total - (prevRec.twValue + prevRec.usValue) : null;
              const mk = monthKey(r.date);
              const showHeader = mk !== lastMonth;
              lastMonth = mk;
              const stat = monthlyStats[mk];
              return (
                <div key={r.id}>
                  {showHeader && (
                    <div className="pt-3 pb-1.5 text-[11px] font-bold mono"
                      style={{ borderTop: i > 0 ? `1px solid ${COLORS.panelBorder}` : "none", marginTop: i > 0 ? "0.25rem" : 0 }}>
                      <div className="flex justify-between items-baseline">
                        <span style={{ color: COLORS.gold }}>{mk}{stat?.approximate ? " *" : ""}</span>
                        {stat ? (
                          <span style={{ color: stat.marketReturn >= 0 ? COLORS.gain : COLORS.loss }}>
                            市場 {stat.marketReturn >= 0 ? "+" : ""}{nf(stat.marketReturn)}（{stat.pct >= 0 ? "+" : ""}{stat.pct.toFixed(2)}%）
                          </span>
                        ) : (
                          <span style={{ color: COLORS.sub, fontWeight: "normal" }}>最早紀錄，無前月可比較</span>
                        )}
                      </div>
                      {stat && stat.contribution != null && stat.contribution !== 0 && (
                        <div className="text-right font-normal" style={{ color: COLORS.gold }}>
                          新增投入 {stat.contribution >= 0 ? "+" : ""}{nf(stat.contribution)}
                        </div>
                      )}
                    </div>
                  )}
                  <Row onDelete={() => remove(r.id)}>
                    <div className="flex-1">
                      <div className="text-sm mono">{r.date}</div>
                      <div className="text-[11px]" style={{ color: COLORS.sub }}>
                        台 {nf(r.twValue)} ／ 美 {nf(r.usValue)}
                      </div>
                      {totalCost > 0 && (
                        <div className="text-[11px] mono" style={{ color: COLORS.sub }}>
                          成本 台 {nf(r.twCost)} ／ 美 {nf(r.usCost)}
                        </div>
                      )}
                    </div>
                    <div className="text-right">
                      <div className="mono text-sm font-bold">{nf(total)}</div>
                      {diff != null && (
                        <div className="text-[11px] mono" style={{ color: diff >= 0 ? COLORS.gain : COLORS.loss }}>
                          {diff >= 0 ? "+" : ""}{nf(diff)}
                        </div>
                      )}
                      {totalCost > 0 && (
                        <div className="text-[11px] mono" style={{ color: (total - totalCost) >= 0 ? COLORS.gain : COLORS.loss }}>
                          損益 {(total - totalCost) >= 0 ? "+" : ""}{nf(total - totalCost)}
                        </div>
                      )}
                    </div>
                  </Row>
                </div>
              );
            });
          })()}
          {records.length === 0 && <Empty text="尚無紀錄，新增第一筆吧" />}
        </div>
      </Panel>
    </div>
  );
}

// ---------------- Holdings Panel ----------------
function HoldingsPanel({ holdings, setHoldings }) {
  const [form, setForm] = useState({ symbol: "", name: "", initialShares: "", target2035: "" });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  // 持股進度頁不另外打報價 API；直接沿用「總覽 → 即時股價」寫入的 livePrices 快取。
  // 這樣首頁是唯一報價來源，避免兩個頁面各自抓一次造成重複請求。
  const [holdingQuotes, setHoldingQuotes] = useState({});

  useEffect(() => {
    let cancelled = false;
    const onLivePricesUpdated = (e) => {
      if (!cancelled && e?.detail?.map) setHoldingQuotes(e.detail.map);
    };
    window.addEventListener("livePricesUpdated", onLivePricesUpdated);

    (async () => {
      const cached = await loadKey("livePrices", null);
      if (cancelled) return;
      setHoldingQuotes(cached?.map || {});
    })();

    return () => {
      cancelled = true;
      window.removeEventListener("livePricesUpdated", onLivePricesUpdated);
    };
  }, []);

  const add = () => {
    if (!form.symbol) return;
    setHoldings((h) => [...h, {
      id: uid(), symbol: form.symbol, name: form.name,
      initialShares: Number(form.initialShares || 0), target2035: Number(form.target2035 || 0),
    }]);
    setForm({ symbol: "", name: "", initialShares: "", target2035: "" });
  };
  const remove = (id) => setHoldings((h) => h.filter((x) => x.id !== id));

  const startEdit = (h) => {
    setEditingId(h.id);
    setEditForm({
      symbol: h.symbol, name: h.name, initialShares: String(h.initialShares), target2035: String(h.target2035),
      manualAvgCost: h.manualAvgCost != null ? String(h.manualAvgCost) : "",
    });
  };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); };
  const saveEdit = () => {
    setHoldings((hs) => hs.map((h) => h.id === editingId ? {
      ...h, symbol: editForm.symbol, name: editForm.name,
      initialShares: Number(editForm.initialShares || 0), target2035: Number(editForm.target2035 || 0),
      manualAvgCost: editForm.manualAvgCost === "" ? "" : Number(editForm.manualAvgCost),
    } : h));
    cancelEdit();
  };

  return (
    <div className="space-y-4">
      <Panel title="持股進度">
        <div className="space-y-3">
          {holdings.map((h) => (
            <div key={h.id} className="rounded-xl p-3" style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}` }}>
              {editingId === h.id ? (
                <div className="space-y-2">
                  <div className="grid grid-cols-2 gap-2">
                    <Field label="代號"><input value={editForm.symbol}
                      onChange={(e) => setEditForm({ ...editForm, symbol: e.target.value })} className="input" /></Field>
                    <Field label="名稱"><input value={editForm.name}
                      onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="input" /></Field>
                    <Field label="期初股數"><input type="number" value={editForm.initialShares}
                      onChange={(e) => setEditForm({ ...editForm, initialShares: e.target.value })} className="input" /></Field>
                    <Field label="目標股數"><input type="number" value={editForm.target2035}
                      onChange={(e) => setEditForm({ ...editForm, target2035: e.target.value })} className="input" /></Field>
                    <div className="col-span-2">
                      <Field label="平均成本（留空=自動用交易紀錄算）">
                        <input type="number" value={editForm.manualAvgCost} placeholder="自動計算"
                          onChange={(e) => setEditForm({ ...editForm, manualAvgCost: e.target.value })} className="input" />
                      </Field>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={cancelEdit} className="rounded-lg py-2 text-xs font-bold"
                      style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, color: COLORS.sub }}>
                      取消
                    </button>
                    <button onClick={saveEdit} className="rounded-lg py-2 text-xs font-bold"
                      style={{ background: COLORS.gold, color: COLORS.bg }}>
                      儲存
                    </button>
                  </div>
                </div>
              ) : (
                <>
                  <div className="flex justify-between items-start">
                    <div className="flex items-baseline gap-2">
                      <span className="font-bold mono">{h.symbol}</span>
                      <span className="text-[11px]" style={{ color: COLORS.sub }}>{h.name}</span>
                      {h.avgTradePrice != null && (
                        <span className="text-[11px] mono" style={{ color: COLORS.gold }}>
                          均價 {h.avgTradePrice.toFixed(2)}
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-3">
                      <button onClick={() => startEdit(h)} style={{ color: COLORS.sub }}><PencilIcon size={15} /></button>
                      <button onClick={() => remove(h.id)} style={{ color: COLORS.sub }}><TrashIcon size={15} /></button>
                    </div>
                  </div>
                  <div className="flex justify-between text-xs mono mt-2">
                    <span style={{ color: COLORS.sub }}>
                      平均成本 <span style={{ color: COLORS.text }}>{h.avgCost != null ? `NT$ ${h.avgCost.toFixed(2)}` : "-"}</span>
                      {h.isManualAvgCost && <span style={{ color: COLORS.gold }}> (手動)</span>}
                    </span>
                    <span style={{ color: COLORS.sub }}>
                      持有成本 <span style={{ color: COLORS.text }}>{h.estCostBasis != null ? `NT$ ${nf(h.estCostBasis)}` : "-"}</span>
                    </span>
                  </div>
                  <div className="flex justify-between text-xs mono mt-2">
                    <span style={{ color: COLORS.sub }}>目前 {nf(h.current)} 股</span>
                    <span style={{ color: COLORS.sub }}>目標 {nf(h.target2035)} 股</span>
                  </div>
                  {(() => {
                    const q = holdingQuotes[h.symbol];
                    const price = Number(q?.price);
                    const prevClose = Number(q?.prevClose);
                    const hasPrice = Number.isFinite(price) && price > 0;
                    const hasPrevClose = Number.isFinite(prevClose) && prevClose > 0;
                    const marketValue = hasPrice
                      ? price * Number(h.current || 0)
                      : null;
                    const estimatedPnl = marketValue != null && Number(h.estCostBasis || 0) > 0
                      ? Math.round(marketValue - Number(h.estCostBasis))
                      : null;
                    const cumulativePct = marketValue != null && Number(h.estCostBasis || 0) > 0
                      ? ((marketValue - Number(h.estCostBasis)) / Number(h.estCostBasis)) * 100
                      : null;
                    return (
                      <div className="flex justify-between text-[11px] mono mt-1">
                        <span style={{ color: COLORS.sub }}>
                          預估損益{" "}
                          <span style={{ color: estimatedPnl == null ? COLORS.sub : (estimatedPnl >= 0 ? COLORS.gain : COLORS.loss) }}>
                            {estimatedPnl == null ? "--" : `${estimatedPnl >= 0 ? "+" : ""}${nf(estimatedPnl)}`}
                          </span>
                        </span>
                        <span style={{ color: COLORS.sub }}>
                          累積獲利率{" "}
                          <span style={{ color: cumulativePct == null ? COLORS.sub : (cumulativePct >= 0 ? COLORS.gain : COLORS.loss) }}>
                            {cumulativePct == null ? "--" : `${cumulativePct >= 0 ? "+" : ""}${cumulativePct.toFixed(1)}%`}
                          </span>
                        </span>
                      </div>
                    );
                  })()}
                  <div className="flex justify-between text-[11px] mono mt-1" style={{ color: COLORS.sub }}>
                    <span>
                      第 {h.quarterNum} 季增加 <span style={{ color: h.quarterSharesAdded >= 0 ? COLORS.text : COLORS.gain }}>
                        {h.quarterSharesAdded > 0 ? "+" : ""}{nf(h.quarterSharesAdded)} 股
                      </span>
                    </span>
                    <span>
                      今年累計 <span style={{ color: h.yearSharesAdded >= 0 ? COLORS.text : COLORS.gain }}>
                        {h.yearSharesAdded > 0 ? "+" : ""}{nf(h.yearSharesAdded)} 股
                      </span>
                    </span>
                  </div>
                  <div className="mt-1 h-1.5 rounded-full overflow-hidden" style={{ background: COLORS.panelBorder }}>
                    <div className="h-full rounded-full" style={{ width: `${h.pct}%`, background: COLORS.gold }} />
                  </div>
                  <div className="flex justify-between items-baseline mt-1">
                    <span className="text-[11px] mono" style={{ color: COLORS.sub }}>{h.projectedLabel}</span>
                    <span className="text-[11px] mono" style={{ color: COLORS.gold }}>
                      達成率 {h.pct.toFixed(1)}%
                    </span>
                  </div>
                </>
              )}
            </div>
          ))}
          {holdings.length === 0 && <Empty text="尚未新增持股標的" />}
        </div>
      </Panel>

      <Panel title="新增持股標的">
        <div className="grid grid-cols-2 gap-2">
          <Field label="代號"><input value={form.symbol}
            onChange={(e) => setForm({ ...form, symbol: e.target.value })}
            placeholder="0056" className="input" /></Field>
          <Field label="名稱"><input value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            placeholder="高股息ETF" className="input" /></Field>
          <Field label="期初股數"><input type="number" value={form.initialShares}
            onChange={(e) => setForm({ ...form, initialShares: e.target.value })}
            placeholder="0" className="input" /></Field>
          <Field label="2035目標股數"><input type="number" value={form.target2035}
            onChange={(e) => setForm({ ...form, target2035: e.target.value })}
            placeholder="0" className="input" /></Field>
        </div>
        <AddButton onClick={add} label="新增標的" />
      </Panel>
    </div>
  );
}

// ---------------- Trades Panel ----------------
function TradesPanel({ trades, setTrades, holdings, costBasis, setCostBasis, accumulatedCost, onFillDailyCost }) {
  const [form, setForm] = useState({
    date: todayStr(), symbol: "", action: "buy", shares: "", price: "", fee: "", tax: "", note: "",
  });
  const add = () => {
    if (!form.symbol || !form.shares || !form.price) return;
    const shares = Number(form.shares), price = Number(form.price);
    const fee = Number(form.fee || 0), tax = Number(form.tax || 0);
    const amount = form.action === "buy" ? shares * price + fee : shares * price - fee - tax;
    setTrades((t) => [...t, {
      id: uid(), date: form.date, symbol: form.symbol, action: form.action,
      shares, price, fee, tax, amount, note: form.note,
    }]);
    setForm({ date: todayStr(), symbol: "", action: "buy", shares: "", price: "", fee: "", tax: "", note: "" });
  };
  const remove = (id) => setTrades((t) => t.filter((x) => x.id !== id));
  const sorted = [...trades].sort((a, b) => b.date.localeCompare(a.date));

  return (
    <div className="space-y-4">
      {costBasis && (
        <Panel title="成本追蹤">
          <Field label="起始成本（交易紀錄開始追蹤之前，已經投入的成本）">
            <input type="number" value={costBasis.startingCost}
              onChange={(e) => setCostBasis({ ...costBasis, startingCost: Number(e.target.value || 0) })}
              className="input" />
          </Field>
          <div className="flex justify-between items-baseline mt-3 text-sm mono">
            <span style={{ color: COLORS.sub }}>目前累積成本（起始成本 + 全部買賣紀錄）</span>
            <span className="font-bold" style={{ color: COLORS.gold }}>NT$ {nf(accumulatedCost)}</span>
          </div>
          {onFillDailyCost && (
            <>
              <button onClick={() => onFillDailyCost(Math.round(accumulatedCost))}
                className="mt-3 w-full rounded-lg py-2 text-[11px] font-bold"
                style={{ background: COLORS.bg, border: `1px solid ${COLORS.gold}`, color: COLORS.gold }}>
                帶入「每日紀錄」台股成本
              </button>
              <div className="text-[10px] mt-1" style={{ color: COLORS.sub }}>
                會跳到「每日紀錄」並自動填好今天的台股成本，確認後按「儲存紀錄」即可
              </div>
            </>
          )}
        </Panel>
      )}

      <Panel title="新增交易">
        <div className="grid grid-cols-2 gap-2">
          <Field label="日期"><input type="date" value={form.date}
            onChange={(e) => setForm({ ...form, date: e.target.value })} className="input" /></Field>
          <Field label="買賣">
            <select value={form.action} onChange={(e) => setForm({ ...form, action: e.target.value })} className="input">
              <option value="buy">買</option>
              <option value="sell">賣</option>
            </select>
          </Field>
          <Field label="代號">
            <input value={form.symbol} onChange={(e) => setForm({ ...form, symbol: e.target.value })}
              placeholder="0050" list="symbols" className="input" />
            <datalist id="symbols">{holdings.map((h) => <option key={h.id} value={h.symbol} />)}</datalist>
          </Field>
          <Field label="股數"><input type="number" value={form.shares}
            onChange={(e) => setForm({ ...form, shares: e.target.value })} className="input" /></Field>
          <Field label="成交價"><input type="number" value={form.price}
            onChange={(e) => setForm({ ...form, price: e.target.value })} className="input" /></Field>
          <Field label="手續費"><input type="number" value={form.fee}
            onChange={(e) => setForm({ ...form, fee: e.target.value })} placeholder="0" className="input" /></Field>
          <Field label="交易稅（賣出）"><input type="number" value={form.tax}
            onChange={(e) => setForm({ ...form, tax: e.target.value })} placeholder="0" className="input" /></Field>
          <Field label="備註"><input value={form.note}
            onChange={(e) => setForm({ ...form, note: e.target.value })} className="input" /></Field>
        </div>
        <AddButton onClick={add} label="新增交易" />
      </Panel>

      <Panel title={`交易紀錄（${trades.length}）`}>
        <div className="space-y-2 max-h-96 overflow-y-auto">
          {sorted.map((t) => (
            <Row key={t.id} onDelete={() => remove(t.id)}>
              <div className="flex-1">
                <div className="text-sm mono">
                  {t.date} <span style={{ color: t.action === "buy" ? COLORS.gain : COLORS.loss }}>
                    {t.action === "buy" ? "買" : "賣"}
                  </span> {t.symbol}
                </div>
                <div className="text-[11px]" style={{ color: COLORS.sub }}>
                  {nf(t.shares)}股 @ {t.price}
                </div>
              </div>

// ---------------- Dividends Panel ----------------
function DividendsPanel({ dividends, setDividends, holdings }) {
  const [form, setForm] = useState({ date: todayStr(), symbol: "", shares: "", perShare: "" });
  // Typing/selecting a symbol that matches a holding auto-fills 股數 with
  // that holding's current share count, so you don't have to look it up
  // and retype it every time — still a normal editable field afterward if
  // the actual ex-dividend-date share count was different.
  const handleSymbolChange = (value) => {
    const match = holdings.find((h) => h.symbol === value);
    setForm((f) => ({
      ...f,
      symbol: value,
      shares: match ? String(match.current) : f.shares,
    }));
  };
  const add = () => {
    if (!form.symbol || !form.shares || !form.perShare) return;
    const amount = Number(form.shares) * Number(form.perShare);
    setDividends((d) => [...d, {
      id: uid(), date: form.date, symbol: form.symbol,
      shares: Number(form.shares), perShare: Number(form.perShare), amount,
    }]);
    setForm({ date: todayStr(), symbol: "", shares: "", perShare: "" });
  };
  const remove = (id) => setDividends((d) => d.filter((x) => x.id !== id));
  const sorted = [...dividends].sort((a, b) => b.date.localeCompare(a.date));
  const total = dividends.reduce((s, d) => s + d.amount, 0);

  return (
    <div className="space-y-4">
      <Panel title="新增配息">
        <div className="grid grid-cols-2 gap-2">
          <Field label="除息日"><input type="date" value={form.date}
            onChange={(e) => setForm({ ...form, date: e.target.value })} className="input" /></Field>
          <Field label="代號">
            <input value={form.symbol} onChange={(e) => handleSymbolChange(e.target.value)}
              placeholder="0056" list="symbols2" className="input" />
            <datalist id="symbols2">{holdings.map((h) => <option key={h.id} value={h.symbol} />)}</datalist>
          </Field>
          <Field label="股數（選了有持股的代號會自動帶入，可再手動調整）"><input type="number" value={form.shares}
            onChange={(e) => setForm({ ...form, shares: e.target.value })} className="input" /></Field>
          <Field label="每股配息"><input type="number" step="0.01" value={form.perShare}
            onChange={(e) => setForm({ ...form, perShare: e.target.value })} className="input" /></Field>
        </div>
        <AddButton onClick={add} label="新增配息紀錄" />
      </Panel>

      <Panel title={`累積股息：NT$ ${nf(total)}`}>
        <div className="space-y-2 max-h-96 overflow-y-auto">
          {sorted.map((d) => (
            <Row key={d.id} onDelete={() => remove(d.id)}>
              <div className="flex-1">
                <div className="text-sm mono">{d.date} · {d.symbol}</div>
                <div className="text-[11px]" style={{ color: COLORS.sub }}>
                  {nf(d.shares)}股 × {d.perShare}
                </div>
              </div>
              <div className="text-right mono text-sm font-bold" style={{ color: COLORS.gold }}>
                +{nf(d.amount)}
              </div>
            </Row>
          ))}
          {dividends.length === 0 && <Empty text="尚無配息紀錄" />}
        </div>
      </Panel>
    </div>
  );
}

      return;

    try {
      const headers = {};

      const res = await fetchWithTimeout(healthUrl, { method: "GET", headers, cache: "no-store" }, 10000);

// ---------------- AI 聊天/問答（浮動按鈕，任何分頁都叫得出來） ----------------
// 把 AI 提議的動作翻成人看得懂的一句話，讓使用者在按確定前知道到底要發生什麼事。
function describeToolCall(tc, holdings) {
  const a = tc.arguments || {};
  switch (tc.name) {
    case "add_trade": {
      const actionLabel = a.action === "sell" ? "賣出" : "買進";
      const feeStr = a.fee ? `，手續費 ${a.fee}` : "";
      const taxStr = a.tax ? `，證交稅 ${a.tax}` : "";
      return `新增交易：${a.date || "今天"} ${actionLabel} ${a.symbol} ${a.shares} 股 @NT$${a.price}${feeStr}${taxStr}`;
    }
    case "update_holding_target":
      return `把 ${a.symbol} 的目標股數改成 ${nf(a.target)} 股`;
    case "update_manual_avg_cost":
      return a.clear
        ? `清除 ${a.symbol} 手動設定的平均成本，改回自動計算`
        : `把 ${a.symbol} 的平均成本手動設定為 NT$${a.avgCost}`;
    case "update_goal": {
      const parts = [];
      if (a.targetAmount != null) parts.push(`目標金額改成 NT$${nf(a.targetAmount)}`);
      if (a.targetYear != null) parts.push(`目標年份改成 ${a.targetYear}`);
      return parts.length ? parts.join("，") : "修改總目標（但沒有帶任何要改的欄位）";
    }
    default:
      return `執行未知動作：${tc.name}`;
  }
}

// 防呆檢查：AI 有時候會在資訊不完整時亂填 0 或空值，而不是照規則先問清楚。
// 這裡在顯示確認卡片前先擋一次，數字明顯不合理（股數/價格 <= 0）就不給按確定，
// 不能只靠系統提示要求 AI 自律，光是文字指令對小模型來說不夠可靠。
function validateToolCall(tc) {
  const a = tc.arguments || {};
  switch (tc.name) {
    case "add_trade":
      if (!(Number(a.shares) > 0)) return "股數不能是 0 或空白，麻煩跟 AI 重新描述完整的股數";
      if (!(Number(a.price) > 0)) return "價格不能是 0 或空白，麻煩跟 AI 重新描述完整的單價";
      if (!a.symbol) return "沒有股票代號";
      return null;
    case "update_holding_target":
      if (!(Number(a.target) > 0)) return "目標股數不能是 0 或空白";
      return null;
    case "update_manual_avg_cost":
      if (!a.clear && !(Number(a.avgCost) > 0)) return "平均成本不能是 0 或空白";
      return null;
    case "update_goal":
      if (a.targetAmount == null && a.targetYear == null) return "沒有帶任何要修改的欄位";
      return null;
    default:
      return null;
  }
}

const READ_TOOL_NAMES = ["query_app_data", "get_live_quotes"];

// 每日紀錄單筆算出所有欄位（總資產/總本金/損益 + 台美股個別），query_app_data 的
// 每一種 daily_records 彙總方式都是拿這個函式的結果去加減比較，AI 完全不用自己算。
function dailyRecordFields(r, fieldsFilter) {
  const twValue = r.twValue || 0, usValue = r.usValue || 0;
  const twCost = r.twCost || 0, usCost = r.usCost || 0;
  const all = {
    totalAsset: twValue + usValue,
    totalCost: twCost + usCost,
    totalGain: (twValue + usValue) - (twCost + usCost),
    twValue, usValue, twCost, usCost,
    twGain: twValue - twCost,
    usGain: usValue - usCost,
  };
  if (Array.isArray(fieldsFilter) && fieldsFilter.length) {
    const picked = {};
    fieldsFilter.forEach((f) => { if (f in all) picked[f] = all[f]; });
    return picked;
  }
  return all;
}
const fmtFieldLine = (obj, signed) => Object.entries(obj)
  .map(([k, v]) => `${k}=${signed && v >= 0 ? "+" : ""}${nf(Math.round(v))}`)
  .join(", ");

// 唯讀查詢工具的實際執行：直接從目前 App 的資料裡撈、用程式碼算，完全不會動到任何資料，
// 所以不用跳確認卡片，AI 要用就自動給它；每一種彙總方式都在這裡算好，AI 只負責決定
// 要查什麼、怎麼把結果講出來，不會有它自己動手算術抄錯數字的風險。
function executeReadTool(tc, { trades, dailyRecords, dividends, holdings }) {
  const a = tc.arguments || {};

  if (tc.name !== "query_app_data") return null;

  if (a.source === "daily_records") {
    const sorted = [...(dailyRecords || [])].sort((x, y) => x.date.localeCompare(y.date));
    if (!sorted.length) return "沒有任何每日紀錄";
    const findAtOrBefore = (dateStr) => {
      let found = null;
      for (const r of sorted) { if (r.date <= dateStr) found = r; else break; }
      return found;
    };
    const agg = a.aggregation || "records";

    if (agg === "records") {
      const inRange = sorted.filter((r) =>
        (!a.fromDate || r.date >= a.fromDate) && (!a.toDate || r.date <= a.toDate));
      const limit = Math.min(200, Number(a.limit) || 120);
      const list = inRange.slice(-limit);
      if (!list.length) return "這個範圍沒有每日紀錄";
      return list.map((r) => `${r.date} ${fmtFieldLine(dailyRecordFields(r, a.fields))}`).join("\n");
    }

    if (agg === "start_end") {
      const fromRec = a.fromDate ? findAtOrBefore(a.fromDate) : sorted[0];
      const toRec = a.toDate ? findAtOrBefore(a.toDate) : sorted[sorted.length - 1];
      if (!fromRec || !toRec) return "這個區間找不到對應的每日紀錄，無法計算";
      const f = dailyRecordFields(fromRec, a.fields), t = dailyRecordFields(toRec, a.fields);
      const diffs = {};
      Object.keys(t).forEach((k) => { diffs[k] = t[k] - f[k]; });
      const noteDates = (fromRec.date !== a.fromDate || toRec.date !== a.toDate)
        ? `（其中一天沒有剛好的紀錄，實際比對：${fromRec.date} → ${toRec.date}）` : "";
      return `${a.fromDate || fromRec.date} 到 ${a.toDate || toRec.date}${noteDates} 變化：\n${fmtFieldLine(diffs, true)}`;
    }

    if (agg === "monthly") {
      const byMonth = {};
      sorted.forEach((r) => { byMonth[r.date.slice(0, 7)] = r; }); // 每月最後一筆
      const allMonths = Object.keys(byMonth).sort();
      const months = allMonths.filter((mk) =>
        (!a.fromDate || mk >= a.fromDate.slice(0, 7)) && (!a.toDate || mk <= a.toDate.slice(0, 7)));
      if (!months.length) return "這個區間沒有可用的月度資料";
      const lines = months.map((mk) => {
        const idx = allMonths.indexOf(mk);
        if (idx <= 0) return `${mk}：最早紀錄，無前月可比較`;
        const e = dailyRecordFields(byMonth[mk], a.fields);
        const s = dailyRecordFields(byMonth[allMonths[idx - 1]], a.fields);
        const diffs = {};
        Object.keys(e).forEach((k) => { diffs[k] = e[k] - s[k]; });
        return `${mk}：${fmtFieldLine(diffs, true)}`;
      });
      return lines.join("\n");
    }

    if (agg === "min_max") {
      const byMonth = {};
      sorted.forEach((r) => { byMonth[r.date.slice(0, 7)] = r; });
      const allMonths = Object.keys(byMonth).sort();
      const field = (Array.isArray(a.fields) && a.fields[0]) || "totalGain";
      const changes = [];
      for (let i = 1; i < allMonths.length; i++) {
        const mk = allMonths[i];
        if ((a.fromDate && mk < a.fromDate.slice(0, 7)) || (a.toDate && mk > a.toDate.slice(0, 7))) continue;
        const e = dailyRecordFields(byMonth[mk]), s = dailyRecordFields(byMonth[allMonths[i - 1]]);
        changes.push({ mk, change: (e[field] || 0) - (s[field] || 0) });
      }
      if (!changes.length) return "這個區間沒有足夠的資料可以比較（至少要橫跨兩個月）";
      const max = changes.reduce((m, c) => (c.change > m.change ? c : m));
      const min = changes.reduce((m, c) => (c.change < m.change ? c : m));
      return `區間內依「${field}」比較：\n漲最多：${max.mk}（${max.change >= 0 ? "+" : ""}${nf(Math.round(max.change))}）\n` +
        `跌最多：${min.mk}（${min.change >= 0 ? "+" : ""}${nf(Math.round(min.change))}）`;
    }

    if (agg === "summary") {
      const inRange = sorted.filter((r) =>
        (!a.fromDate || r.date >= a.fromDate) && (!a.toDate || r.date <= a.toDate));
      if (!inRange.length) return "這個範圍沒有每日紀錄";
      const first = dailyRecordFields(inRange[0], a.fields);
      const last = dailyRecordFields(inRange[inRange.length - 1], a.fields);
      const lines = Object.keys(last).map((k) => `${k}：${nf(Math.round(first[k]))} → ${nf(Math.round(last[k]))}`);
      return `共 ${inRange.length} 筆紀錄，${inRange[0].date} → ${inRange[inRange.length - 1].date}\n${lines.join("\n")}`;
    }

    return `不支援的 aggregation：${agg}`;
  }

  if (a.source === "trades") {
    let list = (trades || []).slice();
    if (a.symbol) list = list.filter((t) => t.symbol === a.symbol);
    if (a.fromDate) list = list.filter((t) => t.date >= a.fromDate);
    if (a.toDate) list = list.filter((t) => t.date <= a.toDate);
    list.sort((x, y) => x.date.localeCompare(y.date));
    if (!list.length) return "查無符合條件的交易紀錄";

    if (a.aggregation === "summary") {
      const buys = list.filter((t) => t.action === "buy");
      const sells = list.filter((t) => t.action === "sell");
      const buyShares = buys.reduce((s, t) => s + t.shares, 0);
      const sellShares = sells.reduce((s, t) => s + t.shares, 0);
      const buyAmount = buys.reduce((s, t) => s + t.amount, 0);
      const sellAmount = sells.reduce((s, t) => s + t.amount, 0);
      return `共${list.length}筆交易：買進${buys.length}筆共${nf(buyShares)}股（金額NT$${nf(buyAmount)}），` +
        `賣出${sells.length}筆共${nf(sellShares)}股（金額NT$${nf(sellAmount)}）`;
    }
    const limit = Math.min(200, Number(a.limit) || 120);
    return list.slice(-limit).map((t) => {
      const fee = t.fee ? `，手續費${t.fee}` : "";
      const tax = t.tax ? `，證交稅${t.tax}` : "";
      return `${t.date} ${t.symbol} ${t.action === "buy" ? "買進" : "賣出"} ${t.shares}股 @NT$${t.price}${fee}${tax}`;
    }).join("\n");
  }

  if (a.source === "dividends") {
    let list = (dividends || []).slice();
    if (a.symbol) list = list.filter((d) => d.symbol === a.symbol);
    if (a.fromDate) list = list.filter((d) => d.date >= a.fromDate);
    if (a.toDate) list = list.filter((d) => d.date <= a.toDate);
    list.sort((x, y) => x.date.localeCompare(y.date));
    if (!list.length) return "查無符合條件的配息紀錄";

    if (a.aggregation === "summary") {
      const total = list.reduce((s, d) => s + d.amount, 0);
      return `共${list.length}筆配息，總金額NT$${nf(total)}`;
    }
    const limit = Math.min(200, Number(a.limit) || 120);
    return list.slice(-limit).map((d) => `${d.date} ${d.symbol} ${nf(d.shares)}股 @NT$${d.perShare}/股 = NT$${nf(d.amount)}`).join("\n");
  }

  if (a.source === "holding_cost") {
    const h = (holdings || []).find((x) => x.symbol === a.symbol);
    const initialShares = h ? Number(h.initialShares || 0) : 0;
    const symbolTrades = (trades || [])
      .filter((t) => t.symbol === a.symbol && t.date <= a.asOfDate)
      .slice()
      .sort((x, y) => x.date.localeCompare(y.date));

    let shares = initialShares;
    let cost = 0; // 期初股數的成本沒有記錄，這裡當作0，結果只反映交易紀錄部分
    for (const t of symbolTrades) {
      if (t.action === "buy") {
        cost += t.shares * t.price + Number(t.fee || 0);
        shares += t.shares;
      } else if (shares > 0) {
        const avgPerShare = cost / shares;
        const sellShares = Math.min(t.shares, shares);
        cost -= avgPerShare * sellShares;
        shares -= sellShares;
      }
    }
    const avgCost = shares > 0 ? cost / shares : null;
    const caveat = initialShares > 0
      ? "（注意：期初股數的成本沒有記錄，這個均價只反映交易紀錄部分，可能不完全準確）"
      : "";
    if (shares <= 0) return `截至${a.asOfDate}：${a.symbol} 股數為0或查無資料${caveat}`;
    return `截至${a.asOfDate}：${a.symbol} 股數${nf(shares)}股，均價NT$${avgCost.toFixed(2)}，總成本NT$${nf(Math.round(cost))}${caveat}`;
  }

  return `不支援的 source：${a.source}`;
}

// AI 助手專用：查即時股價（跟 executeReadTool 不同，這支要打 /quote API，是非同步的）
async function executeLiveQuoteTool(tc, holdings) {
  const a = tc.arguments || {};
  let symbols = Array.isArray(a.symbols) && a.symbols.length
    ? a.symbols.map((s) => String(s).trim().toUpperCase()).filter(Boolean)
    : (holdings || []).filter((h) => Number(h.initialShares) > 0 || (h.target2035 || 0) > 0).map((h) => h.symbol);
  symbols = [...new Set(symbols)];
  if (!symbols.length) return "沒有指定股票代號，也沒有查到任何持股";
  try {
    const { quotes, missing } = await fetchQuotesWithFallback(symbols);
    const lines = symbols.map((sym) => {
      const q = quotes[sym];
      if (!q || q.price == null) return `${sym}：查不到即時股價`;
      return `${sym}：NT$${q.price}${q.asOfDate ? `（${q.asOfDate}）` : ""}`;
    });
    if (missing && missing.length) lines.push(`（查不到報價的代號：${missing.join("、")}）`);
    return lines.join("\n");
  } catch (e) {
    return `即時股價查詢失敗：${e.message}`;
  }
}

function AiChatWidget({ holdings, goal, totalToday, totalInvested, trades, setTrades, setHoldings, setGoal, dailyRecords, dividends, planItems, planSchedule, goalDate, perf, aiFallbackConfig }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]); // {role, content} 一般訊息，或 {role:'assistant', toolCall, status} 確認卡片
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [providerInfo, setProviderInfo] = useState(null); // { provider, model, profile }
  const scrollRef = useRef(null);

  // 開啟 AI 助手時把背景頁面「鎖死」，不能被 iOS 內部的 scroll-into-view
  // 行為拖走。只用 overflow:hidden 不夠——那只能擋使用者手動滑動，擋不住
  // iOS 為了讓聚焦的輸入框可見而做的內部捲動（比 CSS overflow 屬性更底
  // 層）。用 position:fixed 把 body 整個「拔出」文件流，記錄原本捲動位
  // 置，關閉時自動捲回去，不用手動滑回原位。
  //
  // 面板本身貼齊鍵盤交給 CSS 的 env(keyboard-inset-height)（見上面
  // .ai-panel-wrap）。實測過 interactive-widget=resizes-content 沒有真的
  // 讓 dvh 跟著鍵盤縮小，所以不能只靠它；這裡不用 JS 去算面板高度——量
  // visualViewport.height 在這個 PWA 環境下試過也不準。
  useEffect(() => {
    if (!open) return;

    const scrollY = window.scrollY;
    const htmlStyle = document.documentElement.style;
    const bodyStyle = document.body.style;
    const prevHtml = { overflow: htmlStyle.overflow, height: htmlStyle.height };
    const prevBody = {
      position: bodyStyle.position, top: bodyStyle.top, left: bodyStyle.left,
      right: bodyStyle.right, width: bodyStyle.width, overflow: bodyStyle.overflow,
    };
    htmlStyle.overflow = "hidden";
    htmlStyle.height = "100%";
    bodyStyle.position = "fixed";
    bodyStyle.top = `-${scrollY}px`;
    bodyStyle.left = "0";
    bodyStyle.right = "0";
    bodyStyle.width = "100%";
    bodyStyle.overflow = "hidden";

    return () => {
      htmlStyle.overflow = prevHtml.overflow;
      htmlStyle.height = prevHtml.height;
      bodyStyle.position = prevBody.position;
      bodyStyle.top = prevBody.top;
      bodyStyle.left = prevBody.left;
      bodyStyle.right = prevBody.right;
      bodyStyle.width = prevBody.width;
      bodyStyle.overflow = prevBody.overflow;
      window.scrollTo(0, scrollY);
    };
  }, [open]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  // 呼叫一次 /ask，回傳解析後的資料；共用給第一次發問跟「自動查詢後再問一次」用。
  // toolTurns（選填）：之前每一輪「AI 呼叫了什麼工具＋查到的結果」，用正式的
  // assistant/tool 訊息格式接回對話，讓模型判斷「工具已經回覆過了」，不要再塞成文字。
  const askOnce = async (message, history, context, toolTurns) => {
    const deviceIdKey = "stockTrackerDeviceId";
    let deviceId = localStorage.getItem(deviceIdKey);
    if (!deviceId) { deviceId = `d_${uid()}_${uid()}`; localStorage.setItem(deviceIdKey, deviceId); }

    const baseBody = { message, history, context, allowGeminiPrivate: aiFallbackConfig?.allowPrivate === true };
    if (Array.isArray(toolTurns) && toolTurns.length > 0) baseBody.toolTurns = toolTurns;

    const callAskEndpoint = async (url, body, { fallback = false } = {}) => {
      const headers = { "content-type": "application/json", "x-device-id": deviceId };
      if (fallback && aiFallbackConfig?.token) headers["x-fallback-token"] = aiFallbackConfig.token;
      let res;
      try {
        res = await fetchWithTimeout(url, {
          method: "POST", headers, body: JSON.stringify(body), cache: "no-store",
        }, fallback ? 30000 : 20000);
      } catch (e) {
        const err = new Error(e?.name === "AbortError" ? "連線逾時" : (e?.message || "網路連線失敗"));
        err.status = 0;
        throw err;
      }
      const data = await res.json().catch(() => null);
      if (!res.ok || !data?.ok) {
        const err = new Error(data?.error || `問答失敗（HTTP ${res.status}）`);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    };

    try {
      return await callAskEndpoint("/ask", baseBody);
    } catch (primaryError) {
      const fallbackUrl = normalizeExternalAiAskUrl(aiFallbackConfig?.url);
      if (!fallbackUrl || !shouldUseExternalAiFallback(primaryError)) throw primaryError;

      const containsPrivateToolResult = Array.isArray(toolTurns) && toolTurns.some((turn) =>
        Array.isArray(turn?.calls) && turn.calls.some((tc) => tc?.name === "query_app_data")
      );
      if (containsPrivateToolResult && aiFallbackConfig?.allowPrivate !== true) {
        throw new Error("Cloudflare AI 已失敗；獨立 Gemini 備援可用，但這一輪包含私人資產查詢結果。請到『計畫設定 → AI 獨立備援』開啟私人資料授權後再試。");
      }

      const fallbackBody = {
        ...baseBody,
        context: aiFallbackConfig?.allowPrivate === true ? context : "",
      };
      try {
        const data = await callAskEndpoint(fallbackUrl, fallbackBody, { fallback: true });
        if (aiFallbackConfig?.allowPrivate !== true && Array.isArray(data?.toolCalls) && data.toolCalls.some((tc) => tc?.name === "query_app_data")) {
          throw new Error("這個問題需要讀取你的 App 私人資產資料；目前 Gemini 備援的私人資料授權是關閉的。請到『計畫設定 → AI 獨立備援』開啟後再試。");
        }
        return { ...data, provider: data.provider || "gemini-external", fallbackFrom: primaryError.message };
      } catch (fallbackError) {
        throw new Error(`Cloudflare AI：${primaryError.message}；獨立備援：${fallbackError.message}`);
      }
    }
  };

  const send = async () => {
    const text = input.trim();
    if (!text || sending) return;
    setInput("");
    setError("");
    const nextMessages = [...messages, { role: "user", content: text }];
    setMessages(nextMessages);
    setSending(true);

    try {
      const baseContext = buildPortfolioContext(holdings, goal, totalToday, totalInvested, trades, dailyRecords, dividends, planItems, planSchedule, goalDate, perf);
      // 確認卡片不算「文字對話」，送給 AI 的歷史紀錄只留一般文字訊息，避免格式搞亂它。
      const history = nextMessages.slice(0, -1).filter((m) => typeof m.content === "string");

      let data = await askOnce(text, history, baseContext);
      if (data?.provider) setProviderInfo({ provider: data.provider, model: data.model || "", profile: data.profile || "" });

      // 如果 AI 呼叫的是唯讀查詢工具，直接自動執行、把查到的結果用正式的 tool 訊息
      // 接回對話再幫它問一次，使用者完全不用介入；最多自動追問一輪，避免萬一 AI 一直
      // 要求查詢造成無限迴圈。toolTurns 會依序累積每一輪的呼叫+結果，一起送給 /ask。
      let rounds = 0;
      const toolTurns = [];
      const seenReadCalls = new Set();
      while (Array.isArray(data.toolCalls) && data.toolCalls.length > 0 && data.toolCalls.every((tc) => READ_TOOL_NAMES.includes(tc.name)) && rounds < 2) {
        const freshCalls = data.toolCalls.filter((tc) => {
          const key = `${tc.name}:${JSON.stringify(tc.arguments || {})}`;
          if (seenReadCalls.has(key)) return false;
          seenReadCalls.add(key);
          return true;
        });
        if (!freshCalls.length) break;
        const results = await Promise.all(freshCalls.map(async (tc) => ({
          id: tc.id,
          content: tc.name === "get_live_quotes"
            ? await executeLiveQuoteTool(tc, holdings)
            : executeReadTool(tc, { trades, dailyRecords, dividends, holdings }),
        })));
        toolTurns.push({ calls: freshCalls, results });
        data = await askOnce(text, history, baseContext, toolTurns);
        if (data?.provider) setProviderInfo({ provider: data.provider, model: data.model || "", profile: data.profile || "" });
        rounds += 1;
      }

      if (Array.isArray(data.toolCalls) && data.toolCalls.length > 0) {
        // 混到動作型工具（或自動查詢用完額度還是要查）的話，剩下的動作型工具照舊跳確認卡片。
        const actionCalls = data.toolCalls.filter((tc) => !READ_TOOL_NAMES.includes(tc.name));
        if (actionCalls.length > 0) {
          setMessages((m) => [
            ...m,
            ...actionCalls.map((tc) => ({ role: "assistant", toolCall: tc, status: "pending" })),
          ]);
        } else {
          setMessages((m) => [...m, { role: "assistant", content: "AI 已取得查詢資料，但仍未完成回答。請直接重送同一個問題；不需要縮小日期範圍。" }]);
        }
      } else {
        setMessages((m) => [...m, { role: "assistant", content: data.reply }]);
      }
    } catch (e) {
      setError(e?.message || "問答失敗，請稍後再試");
    } finally {
      setSending(false);
    }
  };

  // 實際寫入資料的地方 —— 只有使用者按下「確定」才會執行到這裡，AI 本身碰不到這段程式碼。
  const executeToolCall = (tc) => {
    const a = tc.arguments || {};
    switch (tc.name) {
      case "add_trade": {
        const shares = Number(a.shares), price = Number(a.price);
        const fee = Number(a.fee || 0), tax = Number(a.tax || 0);
        const amount = a.action === "sell" ? shares * price - fee - tax : shares * price + fee;
        setTrades((ts) => [...ts, {
          id: uid(),
          date: a.date || todayStr(),
          symbol: a.symbol, action: a.action === "sell" ? "sell" : "buy",
          shares, price, fee, tax, amount, note: a.note || "",
        }]);
        return { ok: true };
      }
      case "update_holding_target": {
        let found = false;
        setHoldings((hs) => hs.map((h) => {
          if (h.symbol === a.symbol) { found = true; return { ...h, target2035: Number(a.target) }; }
          return h;
        }));
        return found ? { ok: true } : { ok: false, message: `找不到 ${a.symbol} 這檔持股` };
      }
      case "update_manual_avg_cost": {
        let found = false;
        setHoldings((hs) => hs.map((h) => {
          if (h.symbol === a.symbol) {
            found = true;
            return { ...h, manualAvgCost: a.clear ? "" : Number(a.avgCost) };
          }
          return h;
        }));
        return found ? { ok: true } : { ok: false, message: `找不到 ${a.symbol} 這檔持股` };
      }
      case "update_goal": {
        setGoal((g) => ({
          ...g,
          targetAmount: a.targetAmount != null ? Number(a.targetAmount) : g.targetAmount,
          targetYear: a.targetYear != null ? Number(a.targetYear) : g.targetYear,
        }));
        return { ok: true };
      }
      default:
        return { ok: false, message: "不認得這個動作" };
    }
  };

  const confirmToolCall = (idx) => {
    const msg = messages[idx];
    const invalidReason = validateToolCall(msg.toolCall);
    if (invalidReason) {
      // 防呆：就算按鈕被繞過，這裡再擋一次，絕不讓資料不完整的動作真的寫進資料。
      setMessages((m) => m.map((mm, i) => i === idx ? { ...mm, status: "failed", failMessage: invalidReason } : mm));
      return;
    }
    const result = executeToolCall(msg.toolCall);
    setMessages((m) => m.map((mm, i) => i === idx
      ? { ...mm, status: result.ok ? "done" : "failed", failMessage: result.message }
      : mm));
  };

  const cancelToolCall = (idx) => {
    setMessages((m) => m.map((mm, i) => i === idx ? { ...mm, status: "cancelled" } : mm));
  };

  const onKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <>
      <button onClick={() => setOpen(true)}
        className="fixed z-40 rounded-full flex items-center justify-center"
        style={{
          right: 16, bottom: "calc(64px + env(safe-area-inset-bottom, 4px))",
          width: 52, height: 52, background: COLORS.gold, color: COLORS.bg,
          boxShadow: "0 6px 18px rgba(0,0,0,0.4)",
        }}>
        <MessageCircle size={24} />
      </button>

      {open && (
        <div className="ai-panel-wrap fixed inset-x-0 bottom-0 z-50 flex flex-col justify-end"
          style={{ background: "rgba(0,0,0,0.5)" }}
          onClick={(e) => { if (e.target === e.currentTarget) setOpen(false); }}>
          <div className="ai-panel-h flex flex-col rounded-t-2xl" style={{
            background: COLORS.bg,
            maxHeight: "100%",
            overflow: "hidden",
            boxShadow: "0 -8px 24px rgba(0,0,0,0.4)",
          }}>
            <div className="flex items-center justify-between px-4 py-3"
              style={{ borderBottom: `1px solid ${COLORS.panelBorder}`, paddingTop: "max(12px, env(safe-area-inset-top, 0px))" }}>
              <div className="flex items-center gap-2 min-w-0">
                <div className="font-bold text-sm">AI 助手</div>
                {providerInfo && (() => {
                  const isGemini = String(providerInfo.provider || "").toLowerCase().includes("gemini");
                  return (
                    <div className="text-[9px] px-1.5 py-0.5 rounded-full truncate max-w-[170px]"
                      title={`${providerInfo.provider} · ${providerInfo.model}`}
                      style={{ color: isGemini ? COLORS.gold : COLORS.sub, border: `1px solid ${isGemini ? COLORS.gold : COLORS.panelBorder}` }}>
                      {isGemini ? "Gemini 獨立備援" : "GPT-OSS"}
                    </div>
                  );
                })()}
              </div>
              <button onClick={() => setOpen(false)} style={{ color: COLORS.sub }}><X size={20} /></button>
            </div>

            <div ref={scrollRef}
              className={`flex-1 min-h-0 overflow-y-auto px-4 py-3 ${messages.length === 0 ? "flex items-center justify-center" : "space-y-3"}`}>
              {messages.length === 0 && (
                <div className="text-xs text-center" style={{ color: COLORS.sub }}>
                  可以問我閒聊、問你自己的持股狀況，或請我幫你「記一筆交易」「改目標股數」
                </div>
              )}
              {messages.map((m, i) => {
                if (m.toolCall) {
                  const desc = describeToolCall(m.toolCall, holdings);
                  const invalidReason = m.status === "pending" ? validateToolCall(m.toolCall) : null;
                  return (
                    <div key={i} className="flex justify-start">
                      <div className="max-w-[85%] rounded-2xl px-3 py-2.5 text-sm"
                        style={{ background: COLORS.panel, border: `1px solid ${invalidReason ? COLORS.gain : COLORS.gold}` }}>
                        <div className="text-[11px] mb-1" style={{ color: invalidReason ? COLORS.gain : COLORS.gold }}>
                          {invalidReason ? "AI 想執行（資料看起來不完整）：" : "AI 想執行："}
                        </div>
                        <div className="leading-relaxed">{desc}</div>
                        {invalidReason && (
                          <div className="text-[11px] mt-1.5" style={{ color: COLORS.gain }}>⚠ {invalidReason}</div>
                        )}
                        {m.status === "pending" && (
                          <div className="flex gap-2 mt-2.5">
                            <button onClick={() => cancelToolCall(i)}
                              className="flex-1 rounded-lg py-1.5 text-xs font-bold"
                              style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}`, color: COLORS.sub }}>
                              取消
                            </button>
                            <button onClick={() => confirmToolCall(i)} disabled={!!invalidReason}
                              className="flex-1 rounded-lg py-1.5 text-xs font-bold"
                              style={{ background: invalidReason ? COLORS.panelBorder : COLORS.gold, color: invalidReason ? COLORS.sub : COLORS.bg, opacity: invalidReason ? 0.6 : 1 }}>
                              確定執行
                            </button>
                          </div>
                        )}
                        {m.status === "done" && (
                          <div className="text-[11px] mt-2" style={{ color: COLORS.gain }}>✓ 已完成</div>
                        )}
                        {m.status === "failed" && (
                          <div className="text-[11px] mt-2" style={{ color: COLORS.gain }}>✗ 失敗：{m.failMessage}</div>
                        )}
                        {m.status === "cancelled" && (
                          <div className="text-[11px] mt-2" style={{ color: COLORS.sub }}>已取消</div>
                        )}
                      </div>
                    </div>
                  );
                }
                return (
                  <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                    <div className="max-w-[80%] rounded-2xl px-3 py-2 text-sm whitespace-pre-wrap leading-relaxed"
                      style={{
                        background: m.role === "user" ? COLORS.gold : COLORS.panel,
                        color: m.role === "user" ? COLORS.bg : COLORS.text,
                        border: m.role === "user" ? "none" : `1px solid ${COLORS.panelBorder}`,
                      }}>
                      {m.content}
                    </div>
                  </div>
                );
              })}
              {sending && (
                <div className="flex justify-start">
                  <div className="rounded-2xl px-3 py-2 text-sm" style={{ background: COLORS.panel, color: COLORS.sub, border: `1px solid ${COLORS.panelBorder}` }}>
                    思考中…
                  </div>
                </div>
              )}
              {error && <div className="text-xs text-center" style={{ color: COLORS.gain }}>{error}</div>}
            </div>

            <div className="px-3 py-3 flex items-end gap-2"
              style={{ borderTop: `1px solid ${COLORS.panelBorder}`, paddingBottom: "calc(12px + env(safe-area-inset-bottom, 4px))" }}>
              <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={onKeyDown}
                placeholder="輸入訊息…" rows={1}
                className="flex-1 rounded-xl px-3 py-2 text-sm resize-none"
                style={{ 
                  background: COLORS.panel, 
                  border: `1px solid ${COLORS.panelBorder}`, 
                  color: COLORS.text, 
                  outline: "none",
                  WebkitAppearance: "none",
                  lineHeight: "1.5",
                  minHeight: "44px",
                  overflow: "hidden",
                  WebkitBoxSizing: "border-box",
                  boxSizing: "border-box"
                }} />
              <button onClick={send} disabled={sending || !input.trim()}
                className="rounded-xl px-3 py-2.5 flex items-center justify-center"
                style={{ background: COLORS.gold, color: COLORS.bg, opacity: (sending || !input.trim()) ? 0.5 : 1 }}>
                <Send size={18} />
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function TabBar({ tab, setTab, rootRef }) {
  return (
    <div ref={rootRef} className="fixed bottom-0 left-0 right-0"
      style={{
        background: COLORS.panel, borderTop: `1px solid ${COLORS.panelBorder}`,
        paddingBottom: "env(safe-area-inset-bottom, 4px)",
      }}>
      <div className="max-w-2xl mx-auto flex">
        {TABS.map(({ id, label, icon: Icon }) => {
          const active = tab === id;
          return (
            <button key={id} onClick={() => setTab(id)}
              className="flex-1 flex flex-col items-center justify-center gap-0 py-0.5 px-0.5 min-w-0"
              style={{
                color: active ? COLORS.gold : COLORS.sub,
                borderTop: active ? `2px solid ${COLORS.gold}` : "2px solid transparent",
              }}>
              <Icon size={13} />
              <span className="text-[8px] font-medium whitespace-nowrap leading-tight">{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------------- defaults (first run) ----------------
// 【家人共用版】以下這幾個 default* 都改成空白起始狀態，不含任何真實個人資料，
// 給第一次打開這個網址（localStorage 是空的）的人一個乾淨畫面，自己填自己的。
function defaultHoldings() {
  return [];
}
function defaultTrades() {
  return [];
}
function defaultDividends() {
  return [];
}
function defaultDailyRecords() {
  return DAILY_SEED.map((r) => ({ id: uid(), ...r }));
}
function defaultPlan() {
  return [];
}
function defaultPlanSchedule() {
  return {
    startDate: todayStr(),
    initialPrincipal: 0,
    initialAssets: 0,
    // 舊版相容欄位：schema 1 仍可能只有 initialCapital。
    initialCapital: 0,
    monthlyAmount: 0,
    annualReturn: 11,
    horizonMonths: 120,
  };
}


ReactDOM.createRoot(document.getElementById('root')).render(<AssetTracker />);

  </script>
</body>
