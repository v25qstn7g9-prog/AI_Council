<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>AI 圓桌 v1.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100svh}header{position:sticky;top:0;background:#0b0d12e8;backdrop-filter:blur(14px);padding:18px 16px 12px;border-bottom:1px solid #242834;z-index:2}h1{font-size:21px;margin:0}.sub,.muted,.badge{font-size:12px;color:#9299aa}.chat{padding:16px 14px 160px}.card{margin-bottom:14px;padding:13px 14px;border:1px solid #2a2f3a;border-radius:18px;background:#141821;white-space:pre-wrap;line-height:1.55}.me{margin-left:42px;background:#1c2740}.a{border-left:3px solid #67a3ff}.b{border-left:3px solid #ffad66}.judge{border-left:3px solid #8ee6ad;background:#121d18}.err{border-color:#7b3434;background:#241516}.who{font-weight:700;font-size:13px;margin-bottom:6px}footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0b0d12 24%);padding:30px 12px max(14px,env(safe-area-inset-bottom))}.composer{max-width:760px;margin:auto;background:#171b24;border:1px solid #303644;border-radius:22px;padding:10px}textarea{width:100%;min-height:70px;max-height:170px;resize:vertical;background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:8px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}button{border:0;border-radius:14px;padding:10px 14px;font-weight:700;background:#f4f6fb;color:#10131a}.secondary{background:#242a36;color:#d8dce6}button:disabled{opacity:.45}</style></head><body>
<div class="app"><header><h1>AI 圓桌</h1><div class="sub">GPT-OSS 120B × Qwen3 30B · 一題三回合</div></header><main id="chat" class="chat"><div class="card"><div class="who">圓桌規則</div><div class="muted">你問一題 → AI A 先分析 → AI B 挑錯補充 → AI A 最後統整。每題固定 3 次推論，不會無限互聊。🤣</div></div></main></div>
<footer><div class="composer"><textarea id="q" maxlength="1800" placeholder="丟一個問題給兩隻 AI 吵一下…"></textarea><div class="row"><span id="status" class="badge">v1.0 · 不保存對話</span><div><button id="clear" class="secondary">清除</button> <button id="send">開會</button></div></div></div></footer>
<script>const $=s=>document.querySelector(s),chat=$("#chat"),q=$("#q"),send=$("#send"),status=$("#status");function add(c,w,t){let d=document.createElement("div");d.className="card "+c;let a=document.createElement("div");a.className="who";a.textContent=w;let b=document.createElement("div");b.textContent=t;d.append(a,b);chat.append(d);scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}async function run(){let question=q.value.trim();if(!question||send.disabled)return;add("me","你",question);q.value="";send.disabled=true;status.textContent="兩隻 AI 開會中…";try{let r=await fetch("/debate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||`HTTP ${r.status}`);add("a",d.labels?.a||"AI A",d.a);add("b",d.labels?.b||"AI B",d.b);add("judge","圓桌結論",d.final);status.textContent=`完成 · ${d.version}`}catch(e){add("err","開會失敗",e.message);status.textContent="失敗"}finally{send.disabled=false;q.focus()}}send.onclick=run;q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();run()}});$("#clear").onclick=()=>[...chat.querySelectorAll(".card")].slice(1).forEach(x=>x.remove());</script></body></html>
